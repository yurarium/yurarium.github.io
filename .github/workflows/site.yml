name: site

# BUILD WHAT THIS SITE SERVES, FROM THE STORE THE PIPELINE PUBLISHES. STORE-PLAN §11.
#
# The pipeline compiles the corpus and publishes `corpus.sqlite` as a release asset. Everything
# about how a reader is served it is decided here: which files, what shape, the pre-rendered entry
# pages, the cache-busting version on the script. `yurison` has no path that names this repository.
#
# BOTH REPOSITORIES ARE PUBLIC, so nothing here needs a credential. A private producer feeding a
# public consumer would have meant a read token for the private repository sitting in this one's
# secrets, one workflow edit from exposure; with both public a read needs no secret in either
# direction.
#
# ON A SCHEDULE AND ON DEMAND, rather than triggered from the pipeline. A dispatch would need a
# cross-repository token in `yurison`'s secrets; a schedule needs nothing, and the check below is
# cheap enough to run against an unchanged store.
on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "the pipeline release to build from, or `latest`"
        default: latest

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # WHERE THE CORPUS'S RULES ARE, for every step. Both the build and the reader checks read the
    # pipeline's `adapters/`, and each honours this rather than assuming a sibling checkout.
    # `runner.temp` IS NOT AVAILABLE IN A JOB-LEVEL `env` and GitHub rejects the whole file for it,
    # which is a failure before any step starts. `github.workspace` is, and the clone below puts the
    # pipeline beside this checkout exactly as a developer has it.
    env:
      YURARIUM_ADAPTERS: ${{ github.workspace }}/../yurison/adapters
    steps:
      - uses: actions/checkout@v5

      # THE RULES THE CORPUS OWNS, at the commit that made the store. How a name folds and what a
      # citation may show a reader are facts about the corpus with one home, and this reads them
      # rather than keeping a second copy that would drift.
      - name: The pipeline's adapters
        run: |
          git clone --depth 1 https://github.com/yurarium/yurison.git \
            "$GITHUB_WORKSPACE/../yurison"
          ls "$YURARIUM_ADAPTERS/relational/emit.py"

      - name: The published store
        run: |
          TAG='${{ inputs.release }}'
          [ -n "$TAG" ] && [ "$TAG" != latest ] || TAG=$(gh release view --repo yurarium/yurison \
            --json tagName --jq .tagName)
          gh release download "$TAG" --repo yurarium/yurison --pattern corpus.sqlite \
            --dir "$RUNNER_TEMP"
          ls -la "$RUNNER_TEMP/corpus.sqlite"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WHAT THE CORPUS'S RULES IMPORT. The emitters reach the name store through modules that read
      # YAML, which is the only third-party thing on the path between a store and these files.
      - name: Dependencies
        run: pip install --quiet pyyaml

      # THE CHECKS THAT ARE ABOUT WHAT A READER IS SHOWN, which moved here with the rendering they
      # are about. They gate BEFORE the pipeline stops running them, so a check cannot go quiet by
      # changing repository.
      - name: What a reader is shown
        run: python3 build/reader_checks.py --store "$RUNNER_TEMP/corpus.sqlite"

      - name: Build the data this site serves
        run: |
          python3 build/from_store.py --store "$RUNNER_TEMP/corpus.sqlite"

      - name: app.js is the derivation of kari/src
        run: python3 build-app.py --check

      - name: Publish
        run: |
          git config user.name  "Yurarium"
          git config user.email "311755991+yurarium@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          # TWO -m FLAGS AND NOT AN EMBEDDED NEWLINE. A multi-line message inside this block scalar
          # dedented out of it, and `Co-Authored-By:` was parsed as a top-level workflow key: the
          # first run of this file failed before it started a step.
          git commit -m "Site data from the store $(date -u +%F)" \
                     -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push
