name: site

# BUILD WHAT THIS SITE SERVES, FROM THE STORE THE PIPELINE PUBLISHES. STORE-PLAN §11.
#
# The pipeline compiles the corpus and publishes `corpus.sqlite` as a release asset. Everything
# about how a reader is served it is decided here: which files, what shape, the pre-rendered entry
# pages, the cache-busting version on the script. `yurison` has no path that names this repository.
#
# BOTH REPOSITORIES ARE PUBLIC, so nothing here needs a credential. A private producer feeding a
# public consumer would have meant a read token for the private repository sitting in this one's
# secrets, one workflow edit from exposure; with both public a read needs no secret in either
# direction.
#
# DISPATCHED BY THE PIPELINE WHEN IT PUBLISHES, with the schedule kept underneath as the floor.
# `yurison` holds the mechanism and names no repository: which consumer to tell is an Actions
# variable there, and the token is scoped to `Actions: write` on this repository alone. A
# fine-grained token expires within the year and a dispatch that fails is an update nobody sent, so
# the cron stays: push decides the latency, poll decides what an expired credential costs.
on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "the pipeline release to build from, or `latest`"
        default: latest
      # A MONTH WHOSE PUBLISHED ROW SET MAY CHANGE, named deliberately. The guard refuses a build
      # that would drop a row an archive already served, which is right by default and wrong when
      # the corpus has genuinely re-attributed one. Naming the month here puts the decision in the
      # run's own record rather than leaving it to whoever noticed the guard was quiet.
      regenerate:
        description: "months to rebuild even if their row set changes, space separated YYYY-MM"
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # WHERE THE CORPUS'S RULES ARE, for every step. Both the build and the reader checks read the
    # pipeline's `adapters/`, and each honours this rather than assuming a sibling checkout.
    # `runner.temp` IS NOT AVAILABLE IN A JOB-LEVEL `env` and GitHub rejects the whole file for it,
    # which is a failure before any step starts. `github.workspace` is, and the clone below puts the
    # pipeline beside this checkout exactly as a developer has it.
    env:
      YURARIUM_ADAPTERS: ${{ github.workspace }}/../yurison/adapters
    steps:
      - uses: actions/checkout@v5

      # THE RULES THE CORPUS OWNS, at the commit that made the store. How a name folds and what a
      # citation may show a reader are facts about the corpus with one home, and this reads them
      # rather than keeping a second copy that would drift.
      - name: The pipeline's adapters
        run: |
          git clone --depth 1 https://github.com/yurarium/yurison.git \
            "$GITHUB_WORKSPACE/../yurison"
          ls "$YURARIUM_ADAPTERS/relational/emit.py"

      - name: The published store
        run: |
          TAG='${{ inputs.release }}'
          [ -n "$TAG" ] && [ "$TAG" != latest ] || TAG=$(gh release view --repo yurarium/yurison \
            --json tagName --jq .tagName)
          gh release download "$TAG" --repo yurarium/yurison --pattern corpus.sqlite \
            --dir "$RUNNER_TEMP"
          ls -la "$RUNNER_TEMP/corpus.sqlite"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WHAT THE CORPUS'S RULES IMPORT. The emitters reach the name store through modules that read
      # YAML, which is the only third-party thing on the path between a store and these files.
      - name: Dependencies
        run: pip install --quiet pyyaml

      - name: Build the data this site serves
        id: build
        env:
          REGENERATE: ${{ inputs.regenerate }}
        run: |
          ARGS=""
          for m in $REGENERATE; do ARGS="$ARGS --regenerate $m"; done
          # `if` RATHER THAN `[ … ] && echo`. The step runs under `bash -e`, where an && list whose
          # test fails is a failing command, so the empty case would have failed every ordinary run.
          if [ -n "$ARGS" ]; then echo "::warning::rebuilding published month(s):$ARGS"; fi
          python3 build/from_store.py --store "$RUNNER_TEMP/corpus.sqlite" $ARGS

      # AFTER THE BUILD AND BEFORE THE COMMIT, WHICH IS THE ONLY PLACE IT GATES ANYTHING. These
      # read the store for some of what they check and `kari/data` for the rest, so running them
      # first asked about the PREVIOUS build's files. On 2026-08-14 a store published with no floor
      # surfaces produced a `names.json` whose English fallback spelled every Japanese run as
      # question marks, this passed against yesterday's good files, the build committed, and the
      # same check failed the NEXT run: it reported the fault one build after it had shipped it.
      #
      # Here the working tree already holds what is about to be published and nothing is committed
      # yet, so a failure costs a run rather than the site.
      - name: What a reader is shown
        run: python3 build/reader_checks.py --store "$RUNNER_TEMP/corpus.sqlite"

      # THIS REPOSITORY'S OWN SUITES, BEFORE IT PUBLISHES. `gate.yml` runs them on every push,
      # which is where a change is caught; running them here too means a scheduled build cannot
      # publish from a tree whose suites do not pass, whatever was pushed while nobody looked.
      - name: Tests
        run: ./test.py

      - name: app.js is the derivation of kari/src
        run: python3 build-app.py --check

      - name: Publish
        run: |
          git config user.name  "Yurarium"
          git config user.email "311755991+yurarium@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          # TWO -m FLAGS AND NOT AN EMBEDDED NEWLINE. A multi-line message inside this block scalar
          # dedented out of it, and `Co-Authored-By:` was parsed as a top-level workflow key: the
          # first run of this file failed before it started a step.
          # THE STORE'S OWN DATE, NOT THE RUNNER'S. `date -u +%F` is the runner's clock, and the
          # corpus keeps the date it is in Japan: a run at 09:00 JST published today's data under
          # yesterday's date. `build/from_store.py` reports what the store says it was compiled on.
          STAMP="${{ steps.build.outputs.generated }}"
          git commit -m "Site data from the store ${STAMP:-of unstated date}" \
                     -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push
