<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Yurarium: 内部状態 / build status</title>
<link rel="stylesheet" href="app.css">
<style>
  /* This page's own furniture only. Everything else comes from app.css, which is the point: it is
     a page of the site rather than a report that happens to live beside it. */
  .st-sec { margin: 1.7rem 0; }
  .st-sec > h2 { font-size: 1.02rem; margin: 0 0 .35rem; }
  .st-lede { margin: 0 0 .55rem; line-height: 1.65; }
  .st-sec details { border-top: 1px solid rgba(128,128,128,.22); padding-top: .45rem; }
  .st-sec summary { cursor: pointer; font-size: .87em; opacity: .66; }
  .st-sec summary:hover { opacity: 1; }
  table.st { border-collapse: collapse; width: 100%; font-size: .87em; margin-top: .5rem; }
  table.st th, table.st td { text-align: left; padding: .22rem .55rem .22rem 0; vertical-align: top;
                             border-bottom: 1px solid rgba(128,128,128,.14); }
  table.st th { font-weight: 600; opacity: .64; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .st-kind { font-size: .76em; padding: .05rem .38rem; border-radius: .6rem;
             background: rgba(128,128,128,.17); white-space: nowrap; }
  .st-rows { max-height: 17rem; overflow: auto; font-size: .85em; line-height: 1.75;
             margin-top: .4rem; }
  .st-head { display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap;
             margin-bottom: 1.4rem; }
  .st-head h1 { font-size: 1.5rem; margin: 0; }
  /* The brand reads as the brand, not as a link somebody added. Same weight and colour as the
     main page; it happens to be clickable. */
  h1 a.brand { color: inherit; text-decoration: none; }
  .st-sub { opacity: .68; margin: .1rem 0 .9rem; line-height: 1.6; }
  .prefsrow { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .4rem; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="masthead">
   <div class="mast-text">
    <h1><a class="brand" href="./">Yurarium</a> <span class="tag" data-i18n>内部状態 / build status</span></h1>
    <p id="byline" data-i18n>直近の更新、取得の鮮度、残っている作業、そして収蔵の規模。 / What the last update changed, how current each source is, what work remains, and what the database holds.</p>
   </div>
   <!-- The controls sit where they sit everywhere else, in the masthead, using the same wrappers
        so app.css positions them without this page restating any of it. The page used to inherit a
        theme chosen elsewhere and offer nothing of its own. -->
   <span class="ctlbar">
     <span class="ctlrow">
       <span class="themebox" role="group" aria-label="配色 / colour theme">
         <button class="themebtn" data-theme-set="auto"  data-i18n title="follow system">自動 / auto</button>
         <button class="themebtn" data-theme-set="light" data-i18n title="light">明 / light</button>
         <button class="themebtn" data-theme-set="dark"  data-i18n title="dark">暗 / dark</button>
       </span>
       <span class="themebox" role="group" aria-label="表示言語 / interface language">
         <button class="themebtn" data-lang-set="ja"   title="日本語のみ">日本語</button>
         <button class="themebtn" data-lang-set="en"   title="English only">EN</button>
         <button class="themebtn" data-lang-set="both" title="both / 併記">両 both</button>
       </span>
     </span>
   </span>
  </div>
</header>

<main id="st"><p data-i18n>読み込み中 / loading</p></main>
</div>

<script src="app-status.js"></script>
</body>
</html>
