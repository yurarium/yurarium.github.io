<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Yurarium 仮</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#fbfaf9; --fg:#2a2725; --dim:#6b625c; --faint:#968d87;
    --line:#e4dfda; --card:#fff; --accent:#8b5e83; --accent-bg:#f3ecf1;
    --warn-bg:#f7f0e6; --warn-fg:#7a5c2e; --queue-bg:#eef1f4; --queue-fg:#4a5a68;
  }
  /* Dark applies from the system preference unless the reader has explicitly chosen light,
     and from data-theme when they have explicitly chosen dark. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#17151a; --fg:#e6e1dd; --dim:#9a918b; --faint:#6f6660;
           --line:#2e2a32; --card:#1e1b22; --accent:#c79bbd; --accent-bg:#2a2130;
           --warn-bg:#2c2416; --warn-fg:#c9a86a; --queue-bg:#1c222a; --queue-fg:#8ea6b8; }
  }
  :root[data-theme="dark"]{ --bg:#17151a; --fg:#e6e1dd; --dim:#9a918b; --faint:#6f6660;
           --line:#2e2a32; --card:#1e1b22; --accent:#c79bbd; --accent-bg:#2a2130;
           --warn-bg:#2c2416; --warn-fg:#c9a86a; --queue-bg:#1c222a; --queue-fg:#8ea6b8; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.65 ui-sans-serif,system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
  .wrap{max-width:64rem;margin:0 auto;padding:1.4rem 1.1rem 4rem}
  h1{font-size:1.1rem;font-weight:600;margin:0 0 .2rem;letter-spacing:.02em}
  /* The size lives on the WORD, not on the h1: the language and theme controls sit inside the
     heading and would scale with it. At 1.1rem against a 15px body the title was eight per cent
     larger than the text around it, which is not a heading so much as a bold first line. */
  .brand{font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  #byline{margin:.15rem 0 0;color:var(--dim);font-size:.9rem;max-width:38rem}
  .sub{color:var(--dim);font-size:.85rem;margin:0}
  .note{background:var(--warn-bg);color:var(--warn-fg);border-radius:6px;
    padding:.55rem .8rem;font-size:.82rem;margin:.9rem 0 0}
  /* The notes ran to more than a full screen on a phone, so the feed began below the fold.
     Collapsed by default; the coverage line above it stays visible. */
  .legend summary{cursor:pointer;margin-top:.5rem;font-weight:600;opacity:.85}
  .legend[open] summary{margin-bottom:.5rem}
  /* clear: the control bar floats right, and a third group made it tall enough that the tab strip
     flowed alongside it and was squeezed to one character per line. */
  nav{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin:1.1rem 0 1.1rem;clear:both}
  nav button{white-space:nowrap}
  nav button{font:inherit;font-size:.88rem;background:none;border:0;border-bottom:2px solid transparent;
    padding:.5rem .8rem;color:var(--dim);cursor:pointer;margin-bottom:-1px}
  nav button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
  nav .n{color:var(--faint);font-size:.76rem;margin-left:.3rem}
  input[type=search],select{font:inherit;font-size:.88rem;padding:.42rem .6rem;
    border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
  input[type=search]{flex:1 1 15rem;min-width:0}
  /* ONE HEIGHT for everything in a filter bar. There were four in a single row: buttons at 24.6px,
     the picker wrapper at 26.1, the selects at 33.3 and the search input at 38.4, because an input,
     a select and a button each size themselves differently from the same padding. A row of controls
     that do not line up reads as several rows that happen to be adjacent.
     Hierarchy is kept where it belongs, in weight and colour: `reset` is still quieter than the
     filters, it is simply no longer shorter than them. */
  .controls{display:flex;flex-wrap:wrap;gap:.55rem;align-items:stretch;margin-bottom:.9rem;
    --ctl-h:2.15rem}
  .controls > input[type=search], .controls > select,
  .controls > button, .controls .monthpick > button{
    height:var(--ctl-h);box-sizing:border-box;padding-top:0;padding-bottom:0;line-height:1}
  /* The wrapper must not add height of its own, or the button inside it stops matching the row. */
  .controls .monthpick{display:flex;align-items:stretch}
  /* A control holding something other than its default. Slight on purpose: enough to find while
     scanning the row, not enough to read as a warning. The accent is the same one used for the
     current selection elsewhere, so it says "this is set" rather than "this is wrong". */
  /* Two channels, not three. Border and weight carry it; the text colour stays as it is, because
     border plus colour plus weight together read as an alert rather than as a mark, and colour on
     its own would carry the meaning for nobody who cannot see it. */
  .controls [data-active]{border-color:var(--accent)}
  .controls select[data-active], .controls input[data-active],
  .controls .monthpick > button[data-active]{font-weight:600}
  /* The way out, lit at the same moment. Disabled when there is nothing to clear, which is most
     of the time and is also how the two are learned as one idea. */
  .controls button[disabled]{opacity:.4;cursor:default}
  /* THE DISPLAY-DETAIL POPUP. Anchored to its own button rather than to the bar, so it opens
     under the control that summoned it wherever the header has wrapped it to. Right-aligned,
     because the button sits at the end of the row and a left-aligned panel would leave the page. */
  /* overflow:visible undoes .themebox, which clips to its own rounded corners so the buttons
     inside a group square off against them. That clipping removed the whole panel: it reported
     itself open, on screen and 272px wide, and nothing was drawn. This group holds one button and
     has no corners to defend. */
  /* Both classes in the selector, not just .langmore: .themebox is declared further down and the
     two would otherwise tie on specificity, with the later rule winning and the panel staying
     clipped. It reported itself open, on screen and 272px wide, and nothing was drawn. */
  .themebox.langmore{position:relative;overflow:visible}
  .morepop{position:absolute;top:calc(100% + .35rem);right:0;z-index:60;min-width:17rem;
    max-width:min(23rem, calc(100vw - 1.5rem));padding:.7rem .8rem;text-align:left;
    background:var(--bg);border:1px solid var(--line);border-radius:.5rem;
    box-shadow:0 6px 22px rgba(0,0,0,.18)}
  /* A notch on the top edge, pointing at the button that opened the panel. Two triangles, the
     outer one the border colour and the inner one the background, so the notch carries the panel's
     own outline rather than floating free of it. Positioned from the RIGHT, because the panel is
     right-aligned to its button and the button is therefore always at that end. */
  .morepop::before, .morepop::after{content:"";position:absolute;bottom:100%;
    width:0;height:0;border:7px solid transparent;pointer-events:none}
  .morepop::before{right:7px;border-bottom-color:var(--line)}
  .morepop::after{right:8px;border-width:6px;border-bottom-color:var(--bg);margin-bottom:-1px}
  .moregrp{margin:0 0 .85rem}
  .moregrp:last-child{margin-bottom:0}
  /* Divides what applies to the Japanese from what applies to the Latin. */
  .moresep{border:0;border-top:1px solid var(--line);margin:0 0 .85rem}
  .morelab{display:block;font-size:.76rem;color:var(--dim);margin-bottom:.3rem}
  .morenote{font-size:.72rem;color:var(--dim);margin:.35rem 0 0;line-height:1.45}
  /* A group that cannot apply keeps its space and goes inert, the same rule the header row used:
     a control vanishing reflows the panel and the reader loses their place. */
  .moregrp[data-inert]{opacity:.4}
  .moregrp[data-inert] button, .moregrp[data-inert] .enorow{pointer-events:none}

  /* THE ORDER LIST. Draggable rows, and each also carries its own move buttons, because drag is
     unavailable to a keyboard and awkward on a touch screen, and this is a preference rather than
     a flourish. */
  .enorder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.25rem}
  .enorow{display:flex;align-items:center;gap:.4rem;padding:.3rem .4rem;cursor:grab;
    border:1px solid var(--line);border-radius:.35rem;background:var(--bg);font-size:.82rem}
  .enorow[aria-grabbed="true"]{opacity:.45;cursor:grabbing}
  .enorow.over{border-color:var(--accent)}
  .enorow .grip{color:var(--dim);cursor:grab;line-height:1}
  .enorow .nm{flex:1;min-width:0}
  .enorow .ct{color:var(--dim);font-size:.72rem;white-space:nowrap}
  /* Ordered below a form every work has, so it can never be reached. Struck through rather than
     hidden: the reader put it there, and it has to stay visible to be dragged back out. */
  .enorow[data-dead] .nm{text-decoration:line-through;color:var(--dim)}
  .enorow .mv{border:0;background:none;color:var(--dim);padding:0 .15rem;font-size:.85rem;
    line-height:1;cursor:pointer}
  .enorow .mv[disabled]{opacity:.25;cursor:default}
  /* A section the reader opens rather than one they scroll past. The summary carries the count,
     because the number is the reason to open it or leave it shut. */
  .softlist{margin-top:1.1rem;border-top:1px solid var(--line);padding-top:.5rem}
  .softlist > summary{cursor:pointer;color:var(--dim);font-size:.83rem;padding:.3rem 0;
    list-style-position:outside}
  .softlist[open] > summary{margin-bottom:.4rem}
  .count{color:var(--dim);font-size:.83rem;margin:0 0 .7rem}
  ol,ul.plain{list-style:none;margin:0;padding:0}
  li{border-bottom:1px solid var(--line)}
  .row{display:grid;grid-template-columns:1fr auto;gap:.4rem 1rem;align-items:baseline;
    padding:.62rem .2rem;cursor:pointer;background:none;border:0;width:100%;
    text-align:left;font:inherit;color:inherit}
  .row:hover{background:var(--accent-bg)}
  .t{font-weight:600;font-size:.97rem}
  .yomi{color:var(--faint);font-size:.76rem;margin-left:.5rem;font-weight:400}
  .meta{color:var(--dim);font-size:.82rem}
  .num{color:var(--dim);font-size:.8rem;white-space:nowrap;text-align:right}
  /* ONE badge. There were two families (.tag at .68rem and .k at .63rem) which met in the works
     tab, where the state badge is a .k and the access badge beside it is a .tag. Weight had drifted
     too: three classes were 600 and the rest normal, so "Paid early" came out bolder than "Free",
     emphasising a standing series fact over what the update actually did.
     Size and weight now say nothing. COLOUR is the only variable, because it is the only one that
     carries meaning: accent = readable, grey = neutral, queue = ended, warn = costs something. */
  .tag,.k{display:inline-block;font-size:.66rem;font-weight:500;padding:.06rem .36rem;
    border-radius:3px;letter-spacing:.02em;white-space:nowrap;vertical-align:.08em;
    background:var(--accent-bg);color:var(--accent)}
  h1 .tag{margin-left:.45rem}
  .tag.grey{background:var(--line);color:var(--dim)}
  .datewarn{color:var(--warn-fg);font-size:.75rem;margin-top:.2rem;line-height:1.45}
  /* Compact list: one line per update, in the spirit of 百合ナビ's date-grouped table. */
  .cday{display:grid;grid-template-columns:5.7rem 1fr;gap:0 .8rem;
    border-top:1px solid var(--line);padding:.5rem 0}
  .cday-d{font-size:.78rem;color:var(--faint);font-weight:600;padding-top:.15rem;
    font-variant-numeric:tabular-nums}
  /* On a narrow screen a fixed date column costs ~25% of the width for two digits and a slash,
     and titles are what the space is for. Below 34rem the date becomes its own line instead. */
  @media (max-width:34rem){
    .cday{grid-template-columns:1fr;gap:.15rem}
    .cday-d{padding-top:0}
  }
  .cday-l{min-width:0}
  /* Two columns: the kind badge, then everything else as INLINE content. Inline flow means a long
     title wraps within its own column and continues under itself rather than under the badge, and
     the trailing platform name and badges stay attached to the text they belong to. A flex row
     wrapped them into unindented lines that read as separate entries. */
  .crow{display:grid;grid-template-columns:auto 1fr;gap:.35rem;align-items:baseline;
    padding:.14rem 0;line-height:1.55}
  /* One grid cell holding both parts. With .cmain and .cmeta as direct children of the row the
     grid had three items against two columns, so the meta always wrapped to its own grid row,
     stacked whether or not the title needed it. */
  .ccell{min-width:0;overflow-wrap:anywhere}
  .cmain,.cmeta{display:inline}
  .cmain{min-width:0;overflow-wrap:anywhere}
  .cmain > *{margin-right:.35rem}
  .cmeta > *{margin-right:.35rem}
  /* A source name is a name: breaking カドコミ across lines makes it unreadable. */
  .cmeta .m{white-space:nowrap}
  /* When the title has already wrapped, the source name and state badges trail off the end of the
     last line and read as part of the title. Given the row costs a second line anyway, they are
     better off owning it: `.stacked` is set by measurement after render, because whether a title
     wraps depends on the text and the viewport and CSS alone cannot ask. */
  .crow.stacked .cmeta{display:block;margin-top:.1rem}
  .crow.stacked .cmeta > :first-child{margin-left:0}
  /* Wrapped rows need to be told apart from their neighbours once they are more than one line. */
  @media (max-width:34rem){
    .crow{padding:.3rem 0;border-bottom:1px dotted var(--line)}
    .crow:last-child{border-bottom:0}
  }
  .crow a{color:inherit;text-decoration:none;font-weight:600;font-size:.92rem}
  .crow a:hover{color:var(--accent);text-decoration:underline}
  .crow .m{color:var(--dim);font-size:.78rem}
  .k-new,.k-one,.k-free{background:var(--accent-bg);color:var(--accent)}
  .k-ch{background:var(--line);color:var(--dim)}
  .k-fin{background:var(--queue-bg);color:var(--queue-fg)}
  .k-oth,.k-adv{background:var(--warn-bg);color:var(--warn-fg)}
  /* The one shape difference kept: no fill, so it needs an edge to read as a badge at all. Drawn
     as an inset shadow rather than a border so it does not sit 2px wider than its neighbours. */
  .k-unk{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
  /* Removed with their last user: .k-claim (claims no longer reach this page), .k-newfree,
     .tag.q, .tag.warn. */
  .date-h{font-size:.78rem;color:var(--faint);font-weight:600;letter-spacing:.05em;
    padding:1rem 0 .3rem;border-bottom:1px solid var(--line)}
  /* The weekday rides with the date but must not compete with it. It is orientation, not a label. */
  .dow{font-weight:400;opacity:.72}
  /* An English rendering that is OURS, or rests on an unverified reading, is marked: quietly.
     A dotted underline says "this is a rendering" without competing with the name it sits under. */
  .en.ours{border-bottom:1px dotted currentColor}
  /* The English line is the same row again, one step quieter: enough to read as a translation
     of the line above rather than as a second entry, which is what an equally-weighted duplicate
     looks like. */
  .bi{display:block}
  .bi-en{display:block;opacity:.72;font-size:.94em;margin-top:.05rem}
  .ftclear{display:block;margin-top:.4rem}
  .bi-en .t,.bi-en a{font-weight:500}
  .crow .bi-en{font-size:.92em}
  /* The second line has to BREAK the line, and both places it appears are flex rows where
     display:block does not do that. A flex item is blockified already and still sits in the row.
     flex-basis:100% is what forces the wrap; the .cmain case is inline flow, so it needs its own. */
  /* Its own line, but AFTER the badge row rather than splitting it: forcing a flex break in the
     middle pushed the state and access badges onto a third line, so a 両-mode row cost two extra
     lines instead of one. */
  .ensecond{color:var(--dim);font-size:.82rem;font-weight:400;margin-top:.05rem;display:block}
  .crow .ensecond{font-size:.76rem}
  /* Ruby needs room above the line or it collides with the row before it. */
  /* WHY THE CHARACTERS WERE SEPARATING. A reading wider than the characters it annotates widens
     the base with it, because the two share one column: 畳 with じょう over it was pushed to 1.56
     times its own width, and its neighbours moved aside to make room. Measured over 1775 rendered
     ruby units at 375px, 34 were stretched past 1.15.

     The fix is to make the reading narrower, not to change how it is aligned. ruby-align governs
     the reading inside its column and cannot shrink the column. Taking the reading out of flow
     (position:absolute) does remove all 34, and was rejected: it lets neighbouring readings
     overlap each other, which happened to 24 pairs, and unreadable is worse than wide.

     At .48em with a little negative tracking, 3 remain and the worst is 1.31. The reading stays
     large enough to read, which is the point of having it.

     nowrap is a guard rather than a fix: no unit was observed breaking mid-compound, and a
     reading stranded from half its characters is bad enough to be worth preventing anyway. */
  ruby{ruby-position:over;ruby-align:center;white-space:nowrap}
  rt{font-size:.48em;color:var(--dim);font-weight:400;letter-spacing:-.04em;white-space:nowrap}
  /* The title as a whole still wraps: the unbreakable part is one base and its reading, not the
     string. Long single runs are allowed to break rather than overflow the column. */
  .rel .t, .crow .t, .wtitle{overflow-wrap:break-word}
  /* NOT italic. Japanese typefaces have no true italic, so a browser synthesises an oblique slant
      a Latin convention applied to kana, which is why it looked wrong. And the mark was on 100% of
     rendered furigana, because every reading that currently produces ruby is a machine guess: a
     distinction drawn on everything is not a distinction, it is noise that also looked broken.
     The per-item hook stays, because it becomes meaningful as sourced readings arrive; until then
     the honest place to say "these are guesses" is once, above the list. */
  rt.rt-guess{opacity:.85}
  /* A reading somebody looked up and wrote a note for. Not a guess, and not the source's own
     word either, so it is marked as ours in the way a translation is: the reader can see that a
     person decided it. Dotted rather than tinted, because tinting reads as a warning. */
  rt.rt-said{opacity:1;border-bottom:1px dotted var(--dim)}
  .unc{font-size:.62em;color:var(--warn-fg);margin-left:.1em;font-weight:600;cursor:help}
  .rel .t ruby, .crow ruby{line-height:2.1}
  /* The toggle carries ruby of its own, which needs the room a control does not normally give.
     padding-top:0 put the rt hard against the border: ruby needs headroom above the line box, not
     just a taller line. */
  .furibtn{line-height:1.75;padding-top:.34rem;padding-bottom:.16rem}
  .furibtn rt{font-size:.48em;opacity:.75;line-height:1}
  .rel{padding:.6rem .2rem;border-bottom:1px solid var(--line)}
  .rel a{color:inherit;text-decoration:none}
  .rel a:hover .t{color:var(--accent);text-decoration:underline}
  /* Three tiers, so the eye has somewhere to land: the work, then the chapter, then who and where.
     Before this they were all near-equal weight and the row read as a paragraph. */
  .rel .relhead{display:flex;flex-wrap:wrap;gap:.3rem;align-items:baseline}
  .rel .relhead .tag,.rel .relhead .k{margin-left:0}
  .rel .ep{font-size:.88rem;color:var(--fg);opacity:.88;margin-top:.1rem;overflow-wrap:anywhere}
  .rel .pubnote{font-size:.75rem;color:var(--faint);margin-top:.1rem;font-variant-numeric:tabular-nums}
  .rel .line2{display:flex;flex-wrap:wrap;gap:.15rem .5rem;align-items:baseline;margin-top:.2rem}
  /* A credit string can be longer than everything else in the row:
     原作／宮澤伊織(早川書房刊)　作画／水野英多　キャラクター原案／shirakaba, and it was burying the
     chapter. Clamped to one line at full size; the whole string stays available on hover and to a
     screen reader, and the row keeps its shape. */
  .rel .by{max-width:min(30rem,100%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* An anthology instalment belongs to a collection but is its own work by its own author, so the
     collection is shown as context rather than as the title. */
  .rel .coll{color:var(--faint);font-size:.78rem}
  .rel .coll::before{content:"／ "}
  .rel .plat{color:var(--faint)}
  /* A channel sits inside its host, so it reads as a qualifier on the platform rather than beside
     it as an equal. */
  .rel .chan{color:var(--faint);font-size:.76rem}
  .rel .chan::before{content:"／"}
  /* Sources are ways in to one work, not competing entries, so they read as a row of small chips
     under it rather than as another title-weight line. */
  .srcs{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.25rem}
  .src{font-size:.75rem;color:var(--dim);background:var(--line);border-radius:3px;
    padding:.05rem .4rem;white-space:nowrap;text-decoration:none}
  a.src:hover{background:var(--accent-bg);color:var(--accent)}
  .src .srcn{color:var(--faint);margin-left:.3rem;font-variant-numeric:tabular-nums}
  .src .fmt{color:var(--accent);font-weight:600}
  .rel .plat::before{content:"· ";color:var(--faint)}
  @media (max-width:34rem){
    .rel .by{max-width:100%}
    .rel .line2{gap:.1rem .4rem}
  }
  /* The way back through the archive. Deliberately not a nav element: it is the end of the list,
     read once the recent updates run out, so it sits on the page's own hairline rather than being
     given a card or a border of its own. */
  /* An aside, not a warning: an archived month is ordinary information that happens to be old. */
  .snapnote{color:var(--dim);font-size:.8rem;margin:-.3rem 0 .8rem}
  /* MONTH PICKER. A popover rather than a long select: the option list grows twelve entries a
     year, and a reader choosing a period thinks in a calendar rather than in a scrolling list. */
  .monthpick{position:relative}
  #fmonthbtn{white-space:nowrap}
  .mpop{position:absolute;z-index:40;top:calc(100% + .35rem);left:0;min-width:15rem;
        background:var(--card);border:1px solid var(--line);border-radius:.5rem;
        padding:.55rem;box-shadow:0 6px 22px rgba(0,0,0,.22)}
  .mrecent{display:block;width:100%;text-align:left;margin-bottom:.45rem;
           background:none;border:1px solid var(--line);border-radius:.35rem;
           padding:.32rem .5rem;color:inherit;font:inherit;cursor:pointer}
  .mrecent[aria-current=true]{border-color:var(--accent);color:var(--accent)}
  /* The gloss wraps as a unit or not at all. Breaking inside it put "coming soon up to a month"
     on one line and "ahead" on the next, which reads as a sentence the picker is not making. */
  .msub{color:var(--dim);font-size:.78rem;margin-left:.3rem;white-space:nowrap}
  .mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:.35rem}
  .mnav button{background:none;border:0;color:inherit;font-size:1.1rem;cursor:pointer;
               padding:0 .45rem;line-height:1}
  .mnav button[disabled]{opacity:.28;cursor:default}
  .mnav span{font-size:.85rem;font-variant-numeric:tabular-nums}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem}
  .mgrid button{background:none;border:1px solid transparent;border-radius:.35rem;
                padding:.34rem .2rem;color:inherit;font:inherit;font-size:.82rem;cursor:pointer}
  .mgrid button:hover:not([disabled]){border-color:var(--line)}
  /* A month with no archive is shown and disabled rather than hidden: the gap is information,
     and a grid that silently omits months reads as a bug in the calendar. */
  .mgrid button[disabled]{opacity:.3;cursor:default}
  .mgrid button[aria-current=true]{border-color:var(--accent);color:var(--accent)}
  .archbar{display:flex;flex-wrap:wrap;gap:.55rem;align-items:center;
    margin-top:1.6rem;padding-top:1rem;border-top:1px solid var(--line);
    color:var(--dim);font-size:.83rem}
  .quiet{opacity:.62}
  .detail{padding:.3rem .2rem 1.1rem;font-size:.86rem}
  .detail h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;
    color:var(--faint);margin:1rem 0 .35rem;font-weight:600}
  .vols{width:100%;border-collapse:collapse;font-size:.82rem}
  .vols th{text-align:left;color:var(--faint);font-weight:500;padding:.2rem .5rem .2rem 0}
  .vols td{padding:.18rem .5rem .18rem 0;border-top:1px solid var(--line);
    font-variant-numeric:tabular-nums}
  .basis{background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:.6rem .75rem;color:var(--dim);font-size:.82rem}
  .basis a{color:var(--accent)}
  .scroll{overflow-x:auto}
  .empty{color:var(--dim);padding:2rem 0;text-align:center}
  footer{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);
    color:var(--faint);font-size:.78rem}
  footer a{color:var(--accent)}
  [hidden]{display:none !important}
  /* Language and theme are two separate settings and were reading as one strip of six buttons.
     A gap alone did not fix it, and the hairline I tried first landed in the wrong place: both
     boxes were float:right, so the one FIRST in source sits RIGHTMOST and its right border drew on
     the outer edge rather than between the groups.
     So: one flex container, explicit order, and each group drawn as a single segmented control:
     one outline around the group, dividers only between its own buttons. Two bordered objects read
     as two settings without needing a label on either. */
  /* wrap, and never shrink a group: without these the flex row squeezed the language box instead
     of moving to a second line, and .themebox's overflow:hidden silently cut EN and 両 off. A
     control that is present but clipped is worse than one that wrapped. */
  /* A flex row, not a float. The control bar used to sit INSIDE the h1 and float right, which
     held together only while the heading was one small line: raising the title to 2rem dropped
     the controls to their own row and left the byline flowing around them, 118px tall for one
     line of text. The masthead is now two columns that wrap when there is no room. */
  .masthead{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;align-items:flex-start;
    justify-content:space-between}
  .mast-text{min-width:0}
  .ctlbar{display:flex;flex-wrap:wrap;gap:.5rem .85rem;align-items:center;
    justify-content:flex-end;margin-left:auto}
  /* `flex:0 1 auto`, not `0 0 auto`. The row may not shrink was true while it held exactly what
     fitted; adding the "…" button took it past 375px and, unable to narrow, it overflowed to the
     LEFT and put 日本語 off the edge of the screen. A row that cannot shrink cannot wrap either,
     because its own wrapping needs a width to wrap within. */
  .ctlbar > .ctlrow{display:flex;flex-wrap:wrap;gap:.5rem .85rem;align-items:center;
    flex:0 1 auto;max-width:100%;justify-content:flex-end}
  .ctlrow > .themebox{flex:0 0 auto}
  .conditional.inert{visibility:hidden;pointer-events:none}
  /* The theme labels are the only ones that change length with the language: 自動 / auto / 自動 /
     auto, and the language and romanisation groups are self-labelling, so they never move. Left
     alone, that one group rewrapped the bar and the tab strip under it jumped on every switch.
     Reserving its widest state costs a little air in 日本語 and keeps everything below it still. */
  #thbox{min-width:12.6rem;justify-content:space-between}
  #thbox .themebtn{flex:1;text-align:center}
  .themebox{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;
    background:var(--card)}
  .themebox .themebtn{border:0;border-radius:0;border-left:1px solid var(--line);background:none}
  .themebox .themebtn:first-child{border-left:0}
  @media (max-width:34rem){
    .ctlbar{justify-content:flex-end;margin-top:.45rem;gap:.6rem}
  }
  /* Labels gained a second word (両 both, 自動 / auto) and started breaking mid-label on a phone,
     which turns a three-button group into a six-line block. Let the GROUPS wrap instead. */
  .themebtn{font:inherit;font-size:.72rem;padding:.12rem .45rem;cursor:pointer;white-space:nowrap;
    border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:4px}
  .themebtn[aria-pressed=true]{background:var(--accent-bg);color:var(--accent);
    border-color:var(--accent);font-weight:600}
  /* Inside a segmented group the selected button is filled, not outlined. An outline would fight
     the group's own border. */
  .themebox .themebtn[aria-pressed=true]{border-left-color:var(--line)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="masthead">
   <div class="mast-text">
    <h1><span class="brand">Yurarium</span> <span class="tag" data-i18n>仮 / provisional</span></h1>
    <!-- The page opened on a title and a tab strip with nothing saying what it was. Rendered in
        JS because it follows the language toggle like everything else. -->
    <p id="byline"></p>
   </div>
    <span class="ctlbar">
      <!-- Row 1: the controls that are ALWAYS applicable, so they never move.
           Row 2: the two that depend on the language. Splitting every group onto its own line
           cost three rows for six buttons; pairing the stable ones keeps it to two, which is the
           fewest that still lets the conditional pair appear and vanish without shifting them. -->
      <span class="ctlrow">
      <span class="themebox" role="group" aria-label="配色 / colour theme" id="thbox">
        <!-- Theme is not a language, so unlike the buttons above these follow the locale like
             the rest of the chrome. data-i18n puts them through the same splitter. -->
        <button class="themebtn" data-theme-set="auto"  data-i18n title="follow system">自動 / auto</button>
        <button class="themebtn" data-theme-set="light" data-i18n title="light">明 / light</button>
        <button class="themebtn" data-theme-set="dark"  data-i18n title="dark">暗 / dark</button>
      </span>
      <span class="themebox" role="group" aria-label="表示言語 / interface language">
        <button class="themebtn" data-lang-set="ja"   title="日本語のみ">日本語</button>
        <button class="themebtn" data-lang-set="en"   title="English only">EN</button>
        <!-- Each language button labels itself IN its own language, so they do not follow the
             toggle: 日本語 and EN are legible to the reader who wants them. 両 alone is not: it
             says nothing to someone who does not read Japanese, which is exactly half the audience
             this button serves. So it carries its gloss permanently rather than conditionally. -->
        <button class="themebtn" data-lang-set="both" title="both / 併記">両 both</button>
      </span>
      <span class="themebox langmore" role="group" aria-label="表示の詳細 / display detail">
        <button class="themebtn" id="morebtn" aria-haspopup="dialog" aria-expanded="false"
                title="表示の詳細 / display detail">…</button>
        <div class="morepop" id="morepop" role="dialog" aria-label="表示の詳細 / display detail" hidden>

          <!-- Furigana. Optional (§5c), off by default. The button demonstrates itself: 振仮名
               wearing its own furigana. A bare ふ said nothing to a reader who did not already know
               the feature, which is precisely the reader it is for. -->
          <div class="moregrp conditional" id="furibox">
            <span class="morelab" data-i18n>ふりがな / furigana</span>
            <span class="themebox">
              <button class="themebtn furibtn" id="furibtn"
                      title="ふりがな / show readings above kanji"><ruby>振仮名<rt>ふりがな</rt></ruby></button>
            </span>
            <p class="morenote" id="furinote"></p>
          </div>

          <hr class="moresep">
          <!-- Romanisation style. Taste, not correctness, so it is the reader's (NAMES-PLAN §8.1).
               All three are rendered at build time from the same kana, so switching costs nothing. -->
          <div class="moregrp conditional" id="rjbox">
            <span class="morelab" data-i18n>ローマ字 / romanisation</span>
            <span class="themebox">
              <button class="themebtn" data-romaji-set="macron" title="macron: Tōkyō, Yūri">ō</button>
              <button class="themebtn" data-romaji-set="double" title="doubled vowel: Toukyou, Yuuri">ou</button>
              <button class="themebtn" data-romaji-set="plain"  title="plain: Tokyo, Yuri">o</button>
            </span>
          </div>


          <!-- Which English a work is shown by, when it has more than one. The order was fixed
               here and is now the reader's: somebody who knows a series by what a licensor calls
               it should not have to know that we prefer the work's own name. -->
          <div class="moregrp conditional" id="enorderbox">
            <span class="morelab" data-i18n>英語表記の優先順位 / English name, in order of preference</span>
            <ol class="enorder" id="enorder"></ol>
            <p class="morenote" id="enordernote"></p>
          </div>

          <!-- Applied ONLY to text we wrote. A licensed or official English title is a name, and a
               name is not respelt: The Moon on a Rainy Night is what Kodansha publishes it as
               whichever side of the Atlantic the reader is on. -->
          <div class="moregrp conditional" id="dialbox">
            <span class="morelab" data-i18n>綴り / spelling</span>
            <span class="themebox">
              <button class="themebtn" data-dialect-set="gb" title="colour, realise">en-GB</button>
              <button class="themebtn" data-dialect-set="us" title="color, realize">en-US</button>
            </span>
            <p class="morenote" id="dialnote"></p>
          </div>
        </div>
      </span>
      </span>
      </span>
  </div>
</header>

<nav role="tablist">
  <button role="tab" aria-selected="true"  data-tab="feed">更新 <span class="n" id="n-feed"></span></button>
  <button role="tab" aria-selected="false" data-tab="ser">作品 <span class="n" id="n-ser"></span></button>
  <button role="tab" aria-selected="false" data-tab="cat">単行本 <span class="n" id="n-cat"></span></button>
</nav>

<!-- ── FEED ───────────────────────────────────────────────────────── -->
<section id="tab-feed">
  
  <div class="controls" style="margin-top:.9rem">
    <!-- WHICH PERIOD comes first, because it selects the body of data every other control then
         narrows. It used to sit alone at the foot of the tab, below the list it governs, which
         read as an afterthought and put the most navigational control furthest from the rest.
         The grid is a calendar because a reader picking a period thinks in one, and because an
         option list grows by twelve entries every year. -->
    <div class="monthpick">
      <button id="fmonthbtn" class="themebtn" aria-haspopup="dialog" aria-expanded="false"></button>
      <div id="fmonthpop" class="mpop" role="dialog" aria-label="period" hidden>
          <button class="mrecent" id="mrecent"></button>
        <button class="mrecent" id="msoon"></button>
        <div class="mnav">
          <button id="mprev" aria-label="previous year">‹</button>
          <span id="myear"></span>
          <button id="mnext" aria-label="next year">›</button>
        </div>
        <div class="mgrid" id="mgrid"></div>
      </div>
    </div>
    <input type="search" id="fq" placeholder="検索: 作品名・作者 / work, creator" autocomplete="off">
    <select id="fmodel" title="which updates count">
      <option value="all">すべての更新 / all updates</option>
      <option value="free">無料で読める更新 / free to read</option>
    </select>
    <select id="ftype">
      <option value="">すべての種類 / all kinds</option>
      <option value="chapter">話 / chapters</option>
      <option value="oneshot">読み切り / one-shots</option>
    </select>
    <select id="fplat"><option value="">全プラットフォーム / all platforms</option></select>
    <!-- 表示 is the odd one out: the three above narrow WHICH updates are listed, this one only
         changes how they look. It sat third, splitting the filters around it. Now the filters run
         together and the presentation control sits at the end, against the reset button. -->
    <select id="fview" title="layout" style="margin-left:auto">
      <option value="compact">簡易 / compact</option>
      <option value="detail">詳細 / detailed</option>
    </select>
    <button id="freset" class="themebtn" data-i18n title="clear search and all filters">リセット / reset</button>
  </div>
  <p class="count" id="fcount"></p>
  <p class="snapnote" id="fsnap" hidden></p>
  <div id="feed"></div>
  <p class="empty" id="fempty" hidden>該当なし / no matches</p>
  <!-- The select is the STATE. The picker above only sets it and fires `change`, so everything
       that reads el('fmonth').value, persists VIEW_FIELDS or resets filters is unchanged by the
       move. One producer of the fact, one consumer path. -->
  <select id="fmonth" hidden aria-hidden="true" tabindex="-1"></select>
  <div class="archbar" id="archbar" hidden></div>
</section>

<!-- ── CATALOGUE ──────────────────────────────────────────────────── -->
<section id="tab-ser" hidden>
  <div class="controls">
    <input type="search" id="sq" placeholder="検索: 作品名・作者 / work, creator" autocomplete="off">
    <select id="sstate">
      <option value="">すべて / all</option>
      <option value="active">更新中: 45日以内 / updating</option>
      <option value="oneshot">読切 / one-shots</option>
      <option value="completed">完結 / completed</option>
      <option value="slow">停滞: 1年以内 / slow</option>
      <option value="dormant">休眠: 1年超 / dormant</option>
    </select>
    <select id="sfree">
      <option value="">課金状況を問わない / any access</option>
      <option value="free">無料で読める話がある / has free chapters</option>
    </select>
    <select id="splat"><option value="">全プラットフォーム / all platforms</option></select>
    <select id="ssort">
      <option value="latest">最終更新順 / last updated</option>
      <option value="chapters">話数順 / chapter count</option>
      <option value="work">作品名順 / title</option>
    </select>
    <button id="sreset" class="themebtn" data-i18n title="clear search and all filters">リセット / reset</button>
  </div>
  <p class="count" id="scount"></p>
  <div id="serlist"></div>
  <p class="empty" id="sempty" hidden>該当なし / no matches</p>
</section>

<section id="tab-cat" hidden>
  
  <div class="controls" style="margin-top:.9rem">
    <input type="search" id="q" placeholder="検索: 題名・よみ・作者 / title, reading, creator" autocomplete="off">
    <select id="sort">
      <option value="date">刊行順 / by date</option>
      <option value="date-desc">新しい順 / newest</option>
      <option value="yomi">五十音順 / by reading</option>
      <option value="vols">巻数順 / by volumes</option>
    </select>
    <button id="creset" class="themebtn" style="order:99" title="clear search and all filters" data-i18n>リセット / reset</button>
    <select id="filter">
      <option value="">すべて / all works</option>
      <option value="multi">複数巻 / multi-volume</option>
      <option value="single">単巻 / single volume</option>
      <!-- Was: 要確認 / unverified grouping: volumes gathered into a work by title match rather
           than by an explicit series link (80 of 302). That is a statement about how WE grouped
           them, and no reader can adjudicate it. The count now lives on status.html. -->
    </select>
  </div>
  <p class="count" id="count"></p>
  <ol id="list"></ol>
  <p class="empty" id="empty" hidden>該当なし / no matches</p>
</section>

<footer>
  <!-- Rendered in JS rather than written in the markup, because every line of it carries a link
       and the data-i18n split works on plain text. The database's own name was the visible cost of
       that: 文化庁メディア芸術データベース stayed Japanese in English mode because it sat inside an
       anchor nothing translated. Order is sources, then the dating caveat, then where to read more,
       and the storage note last: it is the least urgent thing here and the only one about the
       reader rather than about the manga. -->
  <p id="ftsource"></p>
  <p id="trackfrom" hidden></p>
  <p id="ftstatus"></p>
  <p id="ftprefs"></p>
</footer>
</div>

<script>
/* Preference persistence (localStorage, never cookies).
   Cookies are sent to the server on every request; localStorage never leaves the browser, so
   nothing about the reader reaches GitHub or anyone else. Values are written only in response to
   an explicit choice, and hold no identifier: see the note in the footer. */
const PREF_THEME = 'yurarium.pref.theme';
const PREF_VIEW  = 'yurarium.pref.view';

function prefGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
  catch (e) { return fallback; }          // private mode or storage disabled
}
function prefSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* non-fatal */ }
}

function applyTheme(mode) {
  if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', mode);
  document.querySelectorAll('.themebtn[data-theme-set]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.themeSet === mode)));
}
applyTheme(prefGet(PREF_THEME, 'auto'));
document.querySelectorAll('.themebtn[data-theme-set]').forEach(b =>
  b.addEventListener('click', () => {
    applyTheme(b.dataset.themeSet);
    prefSet(PREF_THEME, b.dataset.themeSet);   // explicit action only
  }));

// Search text is deliberately NOT persisted: restoring a stale query on load is surprising.
const VIEW_FIELDS = ['fmodel', 'ftype', 'fview', 'fplat', 'sort', 'filter',
                     'sstate', 'sfree', 'splat', 'ssort'];
function saveView() {
  const v = { tab: document.querySelector('nav button[aria-selected=true]')?.dataset.tab };
  VIEW_FIELDS.forEach(id => { const e = el(id); if (e) v[id] = e.value; });
  prefSet(PREF_VIEW, v);
}
function restoreView() {
  const v = prefGet(PREF_VIEW, null);
  if (!v) return;
  VIEW_FIELDS.forEach(id => {
    const e = el(id);
    if (e && v[id] != null && [...e.options].some(o => o.value === v[id])) e.value = v[id];
  });
  if (v.tab) document.querySelector(`nav button[data-tab="${v.tab}"]`)?.click();
}

const KANA = 0x60;
/* SEARCH FOLDING. NFKC, case, and hiragana to katakana, plus the macrons.
   Diacritics are folded because a reader who sees Waingāruzu and cannot type ā will write
   Waingaruzu, and ā is never anything but a long a, so the fold cannot lose a distinction.
   ASCII doubles are deliberately NOT folded. Collapsing ou or ee looks symmetrical but titles mix
   scripts: Yuri Fechi LIFE, IDOL×IDOL STORY！. Folding doubles turns Free into Fre, and it erases
   a real difference, since ゆり and ゆうり are different words. The doubled romanisation is indexed
   in full instead, which covers the same input without the damage. */
const MACRONS = { 'ā':'a', 'ī':'i', 'ū':'u', 'ē':'e', 'ō':'o', 'â':'a', 'î':'i', 'û':'u', 'ê':'e', 'ô':'o' };
const norm = s => String(s||'').normalize('NFKC').toLowerCase()
  .replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0)+KANA))
  .replace(/[āīūēōâîûêô]/g, c => MACRONS[c] || c);

/* Spacing is presentation, not identity, which is the judgement store.same_reading already makes
   on the build side. Readings arrive word-separated (ハル ナツ アキ フユ) and a reader typing
   ハルナツアキフユ means the same thing; equally "bloom into you" must still match when typed with
   its spaces. Both sides are compared stripped as well as intact, in ONE place, so every field
   gets the same treatment whether or not it came through searchIndex. */
const bare = s => s.replace(/\s+/g, '');
const hits = (index, q) => index.includes(q) || bare(index).includes(bare(q));

/* Every form of a name, whichever one is on screen.

   English mode showed romaji for 87% of the catalogue and searched none of it: the box matched the
   stored Japanese only, so a reader could search only the text the interface was hiding
   from them. Typing Yuri returned nothing.

   All forms go in regardless of which is displayed. That matters most once a work HAS a
   translation: the interface then shows the English name and hides the romanisation, so indexing
   only what is shown would mean translating a title makes it unfindable by the romaji somebody
   already knew it by. The kana reading is in too, so 百合の花 answers to ゆりのはな without the
   reader knowing the kanji.

   Built once per render rather than per keystroke, and independent of the style toggle: a
   preference about display should not change which rows exist. */
function searchIndex(kind, raw, existing) {
  const rec = nameFor(kind, raw, existing);
  const out = [raw];
  if (rec) {
    if (rec.reading) out.push(rec.reading);
    if (rec.en) out.push(rec.en);
    if (rec.romaji) out.push(rec.romaji.macron, rec.romaji.double, rec.romaji.plain);
  }
  return norm(out.filter(Boolean).join(' '));
}
const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let INDEX = [], FEED = null, SERIES = null, DETAIL = null, open = null;
/* The updates tab is a 14-day window. Earlier months are separate files, fetched only when a reader
   asks for one, and kept once fetched: going back and forth between two months should not re-cost
   the download. META is feed/meta.json: everything in the old feed.json that was not a release row,
   held once instead of repeated in every month. */
let META = null;
const ARCHIVE = new Map();      // "YYYY-MM" -> the parsed month file
const ARCH_PENDING = new Set(); // months being fetched, so a re-render does not fetch twice
let LANG = prefGet('lang', 'both');

/* Split the "日本語 / english" strings the interface is already written in. Captured once into a
   data attribute, so switching back and forth is lossless: re-splitting an already-split string
   would strip a further half each time. */
function splitLang(s, lang) {
  const i = s.indexOf(' / ');
  // A platform name has no " / " to split on, so it falls through here. The filter dropdowns
  // are built from raw names. PLAT_EN is consulted alongside EN so those options localise too;
  // dataset.orig keeps the Japanese, which is what the filter actually matches on.
  if (i < 0) return lang === 'en' ? curly(respell(EN[s.trim()] || PLAT_EN[s.trim()] || s)) : s;
  // Respelt on the English half only. The Japanese half is untouched, and 併記 keeps both.
  return lang === 'ja' ? s.slice(0, i)
       : lang === 'en' ? curly(respell(s.slice(i + 3)))
       : s.slice(0, i) + ' / ' + curly(respell(s.slice(i + 3)));
}
/* Bilingual strings built in JS, where there is no element to carry data-i18n.
   One argument is a badge: look it up in EN, and in 併記 mode show the Japanese alone, because
   "話 / ch" is wider than the row it sits in. Two arguments is prose, which gets both. */
/* The interface's own English is text we wrote, so it follows the spelling setting like the
   translations do. Romanisation is itself one of the words the switch is about, and it is the
   label on the control offering the switch, which is where the omission showed. */
function T(ja, en) {
  const e = en !== undefined ? en : EN[ja];
  if (!e || e === ja) return ja;
  if (LANG === 'en') return curly(respell(e));
  if (LANG === 'ja') return ja;
  return en !== undefined ? `${ja} / ${curly(respell(e))}` : ja;
}

/* Label form: always ONE language, never both. Badges and the volume-count column have no room
   for "巻 / vols", and a two-language string in a 3-character cell reads as noise rather than as
   help. Use T() for prose, L() for anything that sits in a fixed-width slot. */
function L(ja, en) {
  return LANG === 'en' ? curly(respell(en !== undefined ? en : EN[ja] || ja)) : ja;
}



/* ── 併記 as two complete lines ───────────────────────────────────────────────────────────────
   併記 means "show both", and the first attempt read it as "add an English title underneath",
   which left a compact row at three lines (Japanese row / English title / platform) and every
   badge stubbornly Japanese. Taken at its word instead: render the WHOLE row once in each
   language and stack the two. Everything that can be translated is, on its own line, so the
   English line is a row a reader of English can use without reference to the one above it.
   Duplication is the point, not a cost to minimise.

   `inLang` renders a fragment as if the toggle were set to one language. Every label helper
   already reads LANG, so nothing else has to know this is happening. */
function inLang(lang, fn) {
  const prev = LANG;
  LANG = lang;
  try { return fn(); } finally { LANG = prev; }
}

/* One row, or two stacked and distinguished. `render(lang)` must produce a complete row. */
function bilingual(render, cls) {
  if (LANG !== 'both') return render(LANG);
  return `<span class="bi ${cls || ''}">${inLang('ja', () => render('ja'))}` +
         `<span class="bi-en">${inLang('en', () => render('en'))}</span></span>`;
}

/* ── English names and readings ──────────────────────────────────────────────────────────────
   The build ships a kana reading plus all three romanisation styles precomputed, because the
   stored form is kana (NAMES-PLAN §8.1) and the style is the reader's choice: Yūri / Yuuri / Yuri
   are all derivable from kana and none from each other, so nothing is baked and no romanisation
   engine ships to the browser.

   A record is absent for most works, and that is a finished state, not a gap: §6 says show the
   Japanese. So every function here returns null rather than a placeholder when it has nothing. */
const PREF_ROMAJI = 'yurarium.pref.romaji';
const PREF_FURI   = 'yurarium.pref.furigana';
const PREF_ENORDER = 'yurarium.pref.enorder';
const PREF_DIALECT = 'yurarium.pref.dialect';
let ROMAJI_STYLE = prefGet(PREF_ROMAJI, 'macron');
let FURIGANA     = prefGet(PREF_FURI, false);

/* WHICH ENGLISH, IN WHAT ORDER. The build ships every English form it holds for a work under
   `en_forms`, keyed by what makes it that form, plus the romanisation separately. This was a fixed
   precedence in the code: the work's own name, then a licensor's, then ours, then the romanisation.
   That order is defensible and it is still the default, but it is a preference and not a fact, and
   a reader who knows a series by what its licensor calls it should not have to know that we think
   the Japanese publisher's English outranks it.

   `romaji` is a level like the others, and it is the one that makes the control worth having: a
   reader who would rather see Anata no Tonari than a translation nobody has checked can put it at
   the top and get romanisations throughout. */
const EN_LEVELS = ['licensed', 'official-jp', 'translated', 'romaji'];
const EN_LEVEL_LABEL = {
  'licensed':    ['ライセンス版', 'Licensed'],
  'official-jp': ['公式英題', 'Official'],
  // Named for what it is. NAMES-PLAN §5 calls this `translated` and marks it as ours in the
  // interface; from the reader's side the honest word for who did the translating is this one.
  'translated':  ['機械翻訳', 'Machine translation'],
  'romaji':      ['ローマ字', 'Romanisation'],
};
const EN_DEFAULT = ['official-jp', 'licensed', 'translated', 'romaji'];

function enOrder() {
  const saved = prefGet(PREF_ENORDER, null);
  if (!Array.isArray(saved)) return EN_DEFAULT.slice();
  // Repaired rather than trusted. A stored order from an older build may be missing a level that
  // has since been added, and a level absent from the list would be unreachable for ever with
  // nothing on screen to say why.
  const clean = saved.filter(x => EN_LEVELS.includes(x));
  return clean.concat(EN_LEVELS.filter(x => !clean.includes(x)));
}
let EN_ORDER = enOrder();

/* SPELLING. Applied to text WE wrote and to nothing else: a licensed or official English title is
   a name, and names are not respelt. Kodansha publishes The Moon on a Rainy Night, and if a
   licensor spells a title with -ize then that is the title.

   Suffix rules are unusable here: this page is full of romaji, and a rule that rewrites -our or
   -re eats Kaeru, Namae, Sumire and Mae. So it is a dictionary, whole words only, case kept. */
const SPELL_US = {
  colour:'color', colours:'colors', coloured:'colored', colourful:'colorful',
  favour:'favor', favours:'favors', favourite:'favorite', favourites:'favorites',
  honour:'honor', honours:'honors', neighbour:'neighbor', neighbours:'neighbors',
  behaviour:'behavior', flavour:'flavor', flavours:'flavors', humour:'humor',
  rumour:'rumor', rumours:'rumors', savour:'savor', harbour:'harbor', labour:'labor',
  romanisation:'romanization', romanise:'romanize', romanised:'romanized', romanising:'romanizing',
  realise:'realize', realised:'realized', realises:'realizes', realising:'realizing',
  emphasise:'emphasize', normalise:'normalize', capitalise:'capitalize',
  summarise:'summarize', analyse:'analyze', analysed:'analyzed', initialise:'initialize',
  recognise:'recognize', recognised:'recognized', apologise:'apologize',
  organise:'organize', organised:'organized', memorise:'memorize', memorised:'memorized',
  theatre:'theater', theatres:'theaters', centre:'center', centres:'centers',
  metre:'meter', metres:'meters', litre:'liter', litres:'liters', fibre:'fiber',
  grey:'gray', greyer:'grayer', jewellery:'jewelry', practise:'practice',
  travelling:'traveling', travelled:'traveled', traveller:'traveler',
  cancelled:'canceled', cancelling:'canceling', marvellous:'marvelous',
  defence:'defense', offence:'offense', pretence:'pretense', licence:'license',
  catalogue:'catalog', dialogue:'dialog', mould:'mold', moustache:'mustache',
  plough:'plow', pyjamas:'pajamas', storey:'story', storeys:'stories',
};
let DIALECT = prefGet(PREF_DIALECT, 'gb');
/* TYPOGRAPHY, applied at display time and never stored. Straight quotes are a typewriter
   limitation, and the page has no reason to inherit one.

   Applied to LICENSED and OFFICIAL titles too, unlike the spelling switch, because the shape of an
   apostrophe is not part of a name the way its spelling is: There's and There’s are the same
   title set in different type, where realise and realize are different words.

   Display time rather than in the data, so the stored string stays ASCII. That is what the search
   index is built from, so a reader typing an ordinary apostrophe still matches, and it keeps the
   YAML greppable. */
function curly(s) {
  if (!s) return s;
  return String(s)
    .replace(/"([^"]*)"/g, '\u201c$1\u201d')
    // PAIRS BEFORE APOSTROPHES. The other order turned the closing half of 'Manslayer' into an
    // apostrophe, because a quote after a letter and before a space is exactly what the Eguchis'
    // looks like. A pair is unambiguous, so it is claimed first and what is left is an apostrophe.
    .replace(/(^|[\s(\[\u2014])'([^']+)'(?=[\s.,;:!?)\]\u2014]|$)/g, '$1\u2018$2\u2019')
    .replace(/(\p{L})'(?=\p{L})/gu, '$1\u2019')
    .replace(/(\p{L})'(?=\s|$|[,.;:!?)\]])/gu, '$1\u2019');
}


function respell(s) {
  if (DIALECT !== 'us' || !s) return s;
  return s.replace(/[A-Za-z]+/g, w => {
    const hit = SPELL_US[w.toLowerCase()];
    if (!hit) return w;
    // Preserve the case the author used: Colour at the start of a title must not become color.
    if (w === w.toUpperCase() && w.length > 1) return hit.toUpperCase();
    if (w[0] === w[0].toUpperCase()) return hit[0].toUpperCase() + hit.slice(1);
    return hit;
  });
}

const HAS_KANJI = /[\u4e00-\u9fff]/;

/* Whole-string ruby: NAMES-PLAN §5c level 1. Per-kanji alignment is level 2 and is not attempted
   here: ruby over the wrong character is worse than none, and unlike a whole-string reading it is
   wrong in a specific, visible place. Suppressed when the title has no kanji, because furigana over
   ワインガールズ tells a reader nothing they cannot already read. */
/* Ruby per KANJI RUN. The build ships spans aligned with the anchor algorithm, so 雨夜の月 gets
   あまよ over 雨夜 and つき over 月, with の bare. The earlier version stacked the whole reading over
   the whole title, which is not how furigana works and broke the column on long titles.
   No length cap is needed any more: aligned ruby wraps with the text it annotates. */
function ruby(ja, rec) {
  if (!FURIGANA || !rec || !rec.ruby || !HAS_KANJI.test(ja)) return esc(ja);
  /* WHAT KIND OF READING THIS IS, not merely whether to doubt it. `researched` is a person's
     decision with a reason recorded, which is the same standing a translation has on the English
     side and deserves the same treatment: shown as ours, not as a machine's guess. */
  const cls = rec.reading_basis === 'researched' ? ' class="rt-said"'
            : rec.unverified ? ' class="rt-guess"' : '';
  return rec.ruby.map(([text, rd]) => rd
    ? `<ruby>${esc(text)}<rt${cls}>${esc(rd)}</rt></ruby>`
    : esc(text)).join('');
}

/* Names for rows that carry none. An archived month is written once and never rewritten (that is
   what protects its dates), so 2026-07 was frozen before any of this existed and every row in it
   showed Japanese only. Dates must not change; a romanisation improving is the system working. So
   the archive keeps its rows as published and the current names are joined on here, at render
   time, from one file covering every month.

   Folded exactly as the build folds, because （私に） and (私に) are different strings and the same
   work arrives as both. */
let NAMES = null;
function foldKey(t) {
  return (t || '').normalize('NFKC').replace(/ /g, '');
}
function nameFor(kind, raw, existing) {
  if (existing) return existing;
  if (!NAMES || !raw) return null;
  return NAMES[kind][foldKey(raw)] || null;
}

/* What this record can offer at each level. Kept separate from the choosing, so the popup can
   count what is available without duplicating the rules that decide what is shown. */
function enAvailable(rec) {
  if (!rec) return {};
  const out = Object.assign({}, rec.en_forms || {});
  // A record predating en_forms, or one whose only claim is the live one.
  if (rec.en && rec.basis && rec.basis !== 'romaji' && !out[rec.basis]) out[rec.basis] = rec.en;
  // basis 'romaji' is a ROMANISATION, so render it from the kana whenever we hold the kana,
  // otherwise the style control silently does nothing to it, which is exactly the failure §8.1
  // exists to prevent. Some records arrived as a romanised string with no reading behind it; those
  // fall back to the stored string and cannot follow the toggle. That is a property of the record,
  // not of the design, and it disappears as readings are filled in.
  const styled = rec.romaji && rec.romaji[ROMAJI_STYLE];
  if (styled) out.romaji = styled;
  else if (rec.en && rec.basis === 'romaji') out.romaji = rec.en;
  return out;
}

function enOf(rec) {
  if (!rec) return null;
  const have = enAvailable(rec);
  for (const level of EN_ORDER) {
    if (!have[level]) continue;
    const ours = level === 'translated' || level === 'romaji';
    // Respelt only where it is ours to respell. See SPELL_US.
    // Spelling is ours to change; typography applies to every form, including a
    // licensor's, because the shape of an apostrophe is not part of the name.
    const text = curly(ours ? respell(have[level]) : have[level]);
    return { text, ours, unverified: !!rec.unverified, basis: level };
  }
  return null;
}

/* Marked when it is OURS or when the reading behind it is unverified; unmarked when it is the
   work's own English name or a licensor's. §5d: an unverified reading IS marked in the reader
   interface, and that is not a return of 要確認. It is a fact about the name, a reader who knows
   Japanese can judge it on sight, and it stops a real person being authoritatively misnamed. */
/* A reading we assembled character by character, because nothing could read the word. Marked
   visibly and separately from an ordinary guess: those are merely unsourced, this one is likely to
   be WRONG in a specific way a reader can see. The isolated reading of a character is often not
   its reading in a compound, so 抱き came out カカエ where it should be ダキ. The mark is the
   smallest thing that cannot be mistaken for part of the name. */
function uncertainMark(rec) {
  return rec && rec.uncertain
    ? `<sup class="unc" title="${esc('this reading was assembled character by character and may well be wrong')}">[?]</sup>`
    : '';
}

function enHtml(rec, cls) {
  const e = enOf(rec);
  if (!e) return '';
  const why = e.unverified
    ? 'reading not confirmed against a source. This romanisation may be wrong'
    : e.ours
      ? (e.basis === 'romaji' ? 'our romanisation of the Japanese, not an English title the work has'
                              : 'our translation, not an English title the work has')
      : 'the English name the work itself uses';
  const mark = (e.ours || e.unverified) ? ' ours' : '';
  return `<span class="en${mark} ${cls || ''}" title="${esc(why)}">${esc(e.text)}</span>${uncertainMark(rec)}`;
}

/* Titles: EN replaces the Japanese, and in 併記 the whole ROW is rendered again in English by
   bilingual() rather than a title being appended here, so this only ever produces one language. */
/* A collection is a work, so it gets a work's rendering. It was the one title-shaped string on the
   row that never went through the store. */
/* Chapter names, collections and credit lines. Not titles. A chapter name is mostly structure
   (第12話 -> Ch. 12) and a credit line is roles plus names, so they live in their own map, but
   they are looked up exactly the same way. Falls through to the Japanese when nothing is held. */
function phraseOf(ja) {
  if (LANG !== 'en' || !ja || !NAMES || !NAMES.phrases) return ja;
  return NAMES.phrases[foldKey(ja)] || ja;
}

function workTextOf(ja) {
  const e = enOf(nameFor('titles', ja, null));
  return (LANG === 'en' && e) ? e.text : phraseOf(ja);
}

function workLabel(r) {
  const e = enOf(nameFor('titles', r.work, r.work_en));
  const rec = nameFor('titles', r.work, r.work_en);
  if (LANG === 'en' && e) return esc(e.text) + uncertainMark(rec);
  if (LANG === 'en') { const ph = phraseOf(r.work); if (ph !== r.work) return esc(ph); }
  return ruby(r.work, rec) + (FURIGANA ? uncertainMark(rec) : '');
}

/* Authors likewise: one language, chosen by the caller's context. A romanisation and its Japanese are the same name
   twice, so the toggle picks one (§5b). */
function authorLabel(r) {
  const rec = nameFor('authors', (r.author || '').trim(), r.author_en);
  const e = enOf(rec);
  if (!e) {
    const ph = phraseOf((r.author || '').trim());
    return esc(ph);
  }
  if (LANG === 'en') {
    // A credit line has no reading of its own (it is roles and several people) so it is rendered
    // as a phrase rather than a name, and only falls back to the name store for a single author.
    const ph = phraseOf((r.author || '').trim());
    if (ph !== (r.author || '').trim()) return esc(ph);
    return enHtml(rec, 'byen');
  }
  // No 'both' branch any more. In 併記 this is called twice (once per line) so pairing the two
  // scripts HERE would print the romanisation twice on the English line and once on the Japanese.
  return esc(r.author || '');
}

/* Weekday, short. Web serials run to a weekly slot far more than to a date. A reader tracking a
   Saturday series reads the day before the number. Parsed as UTC so the label cannot slip a day on
   a browser west of Greenwich; these dates are calendar days, not instants. */
const DOW_JA = ['日','月','火','水','木','金','土'];
const DOW_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
/* A DATE IS MOSTLY NOT A TRANSLATION PROBLEM. 08-03 and 2026-08-03 belong to neither language:
   English would write 3 Aug and Japanese 8月3日, and the ISO order reads correctly to both. Only
   two tokens are language-bound, the weekday and the month name, and they are what these two
   functions produce.

   併記 SHOWS BOTH, as it does everywhere else. The day heading is a divider, so it cannot take a
   second line the way §5b gives one to a title, but the token is three characters and doubles
   along the axis that is free. The month picker's own button already did this, from
   the same mode, because it happens to route through T().

   Neither used to decide anything for 併記. `LANG === 'en' ? EN : JA` gave it Japanese because it
   is not 'en', so the page showed 月 beside a button reading 最新 / latest. */
function dow(d) {
  if (!/^\d{4}-\d\d-\d\d/.test(d || '')) return '';
  const n = new Date(d.slice(0, 10) + 'T00:00:00Z').getUTCDay();
  return LANG === 'en' ? DOW_EN[n] : LANG === 'ja' ? DOW_JA[n] : `${DOW_JA[n]} ${DOW_EN[n]}`;
}

/* Platform names in English.
   Where the platform publishes its own Latin-script name: pixiv Comic, Comic Days, Sunday Webry,
   KADOKOMI, Magazine Pocket. That name is used, because it is the one the platform answers to and
   the one a reader will find. Where it publishes none, this is a romanisation and nothing more: a
   best-effort reading of the Japanese, marked as such rather than invented as a translation.
   Names already in Latin script are absent from the map and pass through untouched. */
const PLAT_EN = {
  'pixivコミック':'pixiv Comic', 'コミックDAYS':'Comic Days', 'サンデーうぇぶり':'Sunday Webry',
  'カドコミ':'KADOKOMI', 'マガポケ':'Magazine Pocket', '少年ジャンプ+':'Shonen Jump+',
  'ガンガンONLINE':'GANGAN ONLINE', 'ニコニコ漫画':'Niconico Manga', 'コロコロオンライン':'CoroCoro Online',
  'となりのヤングジャンプ':'Tonari no Young Jump', 'くらげバンチ':'Kurage Bunch',
  'コミックガルド':'Comic Gardo', 'コミックゼノン':'Comic Zenon', 'コミックボーダー':'Comic Border',
  'コミック アース・スター':'Comic Earth Star', 'チャンピオンクロス':'Champion Cross',
  'ヤングチャンピオン':'Young Champion', 'ヤンマガWeb':'Yanmaga Web', 'マンガワン':'Manga One',
  'マンガPark':'Manga Park', 'マンガよもんが':'Manga Yomonga', '一迅プラス':'Ichijin Plus',
  '花とゆめ+':'Hanayume+', 'webアクション':'Web Action', 'まんがタイムSquare':'Manga Time Square',
  'ダ・ヴィンチニュース':'Da Vinci News', 'ゼロサムオンライン':'Zero-Sum Online',
  'コミックPASH! neo':'Comic PASH! neo', 'コミックトレイル':'Comic Trail',
  'コミックグロウル':'Comic Growl', 'コミックノヴァ':'Comic Nova', 'コミックリュエル':'Comic Ruelle',
  'COMICリュエル':'COMIC Ruelle', 'COMIC熱帯':'COMIC Nettai', 'コミックオギャー!!':'Comic Ogyaaa!!',
  'ファイアCROSS':'Fire CROSS', 'フラコミlike!':'Furacomi like!', 'ゼノン編集部':'Zenon editorial',
  '竹コミ':'Takecomi', 'キミコミ':'Kimicomi', 'ビッコミ':'Bikkomi', 'ライコミ':'Raicomi',
  'Gコミ':'G-Comi', 'アサコミ':'Asacomi', 'きららベース':'Kirara Base',
  'GANMA!(更新終了)':'GANMA! (ended)', 'コミックゼノン':'Comic Zenon',
  'マイナビニュース':'Mynavi News', 'ヤンジャン+':'Yanjan+', 'コミックエッセイ劇場':'Comic Essay Gekijo',
};
/* Creator role markers, which arrive welded into the credit string: "[著]森永みるく",
   "[漫画]東雲水生 / [脚本]駒尾真子". The NAME is a proper noun and stays as it is in every mode:
   transliterating a mangaka is not translation, it is guessing. The bracketed ROLE is a label and
   is rendered. MADB's own vocabulary, so the set is small and closed. */
const ROLE_EN = {
  '著':'author', '原作':'story', '漫画':'art', '作画':'art', '脚本':'script',
  'キャラクターデザイン原案':'character design',
};
function credit(c) {
  if (LANG !== 'en' || !c) return c || '';
  return c.replace(/\[([^\]]+)\]/g, (m, r) => ROLE_EN[r] ? `[${ROLE_EN[r]}]` : m);
}

/* The source chips sit OUTSIDE bilingual(). They are links, and two sets of clickable chips to the
   same platforms reads as a bug rather than a translation. But that left them Japanese-only in
   併記, where the whole point is to show both. So the chip carries both names on ONE link instead
   of the row carrying two links. */
function platBoth(n) {
  if (!n) return '';
  const en = PLAT_EN[n];
  if (!en || en === n) return n;
  return LANG === 'en' ? en : LANG === 'ja' ? n : `${n} / ${en}`;
}

function platName(n) {
  // A name, not a phrase: shown as one or the other, never "ガンガンONLINE / GANGAN ONLINE".
  // That doubles the width of a meta line for no gain. Absent from the map means already Latin,
  // or no rendering worth asserting.
  return (LANG === 'en' && PLAT_EN[n]) || n || '';
}

/* Set once from run.json, re-rendered on every language change like the rest of the chrome. */
let TRACK_FROM = null;
/* The footer, in whichever language is showing. The reasoning behind the dating caveat and the
   whole of the storage arrangement live on status.html; a footer states the consequence and points
   there, rather than explaining the machinery to somebody who came to read about manga. */
/* STACKED, NOT SLASHED. T() joins the two languages with " / ", which is right for a badge or a
   count line where the pair is short. A footer paragraph is a sentence, and two sentences spliced
   by a slash read as one long broken one. The rows already stack their English underneath in
   .bi-en; the footer uses the same treatment so the page has one answer to this rather than two. */
function ftLine(ja, en) {
  if (LANG === 'ja') return ja;
  if (LANG === 'en') return en;
  return `${ja}<span class="bi-en">${en}</span>`;
}

function renderByline() {
  const p = el('byline');
  if (p) p.innerHTML = ftLine('日本の百合漫画のデータベース', 'A database of Japanese yuri manga');
}

function renderFooter() {
  // EACH HALF IS BUILT WHOLE, in its own language, and T() then picks. Calling T() for the
  // database name and dropping the result into another T() nested the doubling: 併記 mode read
  // "文化庁メディア芸術データベース / Media Arts Database" inside the Japanese sentence AND inside
  // the English one. A name is part of the sentence it sits in, not a separate decision.
  const MADB_URL = 'https://mediaarts-db.artmuseums.go.jp/';
  const OPENBD = '<a href="https://openbd.jp/">openBD</a>';
  el('ftsource').innerHTML = ftLine(
    `書誌情報は<a href="${MADB_URL}">文化庁メディア芸術データベース</a>（1.2.18）と${OPENBD}、`
    + `更新情報は各プラットフォームの配信元から。事実に著作権はなく、独自の分類と注記は CC0。`
    + `表紙画像・あらすじ・漫画本編は掲載していません。`,
    `Bibliographic facts from <a href="${MADB_URL}">Media Arts Database</a> (1.2.18) and ${OPENBD};`
    + ` release data from publishers' own feeds. Facts are not copyrightable; original`
    + ` classifications and notes are CC0. No cover art, synopses or manga are hosted here.`);

  // A link, not a paragraph. What the page contains is the page's business, and a footer that
  // explains its own links is spending a reader's attention on navigation rather than on manga.
  el('ftstatus').innerHTML =
    `<a href="status.html">${T('内部状態', 'build status')}</a>`;

  // The button follows the whole pair rather than riding on the English line, which is where a
  // trailing concatenation would put it in 併記 mode. Its LABEL keeps the slash form, unlike the
  // sentences above it: that is what every other control on the page does in 併記 (the tabs read
  // "更新 / Updates"), and a two-word label is the case the slash was always for. Stacking a
  // button's label would make the control two lines tall for no gain.
  el('ftprefs').innerHTML = ftLine(
    '表示設定（テーマ・タブ・絞り込み）はブラウザのローカルストレージに保存されます。'
    + 'クッキーは使用せず、設定がインターネットに送信されることはありません。',
    "This site stores your display preferences (theme, tab and filters) in your own browser's "
    + 'local storage. No cookies are set, and no preferences are sent over the Internet.')
    + `<span class="ftclear"><button id="clearprefs" class="themebtn">`
    + `${T('設定を消去', 'clear preferences')}</button></span>`;
  wireClearPrefs();
}

/* SAID ONCE. The dating caveat used to carry its own build-status link, and there was a second
   paragraph carrying another one, so the footer pointed at the same page twice within four lines.
   The caveat states the consequence; the reasoning is on status.html, which the line below links. */
function renderTrackNote() {
  const p = el('trackfrom');
  if (!p || !TRACK_FROM) return;
  p.hidden = false;
  p.innerHTML = ftLine(
    `更新の追跡開始は ${TRACK_FROM}。それ以前のウェブ漫画の公開日は正確とは限りません。`,
    `Update tracking began on ${TRACK_FROM}. Web manga publication dates before ${TRACK_FROM}`
    + ` may not be reliable.`);
}

/* Said once rather than stamped on every reading. While essentially all of them are machine
   guesses, a per-item mark states the default and tells a reader nothing; this states the actual
   situation and stops being needed when sourced readings outnumber guessed ones. */
/* WHERE THE CONVENTION IS EXPLAINED, and where it is not. This used to be a paragraph above the
   list, shown whenever furigana was on. It said in aggregate what the page already says per
   reading: an unverified one is marked where it appears, which is better, because it names WHICH
   are guesses rather than saying most of them are. Above the list it also stacked a third grey
   line under the count and the period note.

   It is still worth saying once, because the mark is quiet by design and a reader meeting it for
   the first time has nothing to read it against. So it sits beside the control that turns the
   readings on, like the spelling and precedence notes do, and it says the marks exist.

   The MARK itself is untouched and is not up for tidying: FEATURES-INTERFACE §5 makes it the one
   piece of our own uncertainty shown to readers, on purpose. */
function renderFuriNote() {
  const n = el('furinote');
  if (!n) return;
  n.textContent = T(
    '大半は自動生成された推定で、出典に基づくものではありません。推定の読みには印がつきます。',
    'Most are generated rather than taken from a source. The generated ones are marked where they '
    + 'appear.');
}

/* A control that is not applicable keeps its space. Using [hidden] meant every language switch
   removed a group from the layout and the whole header (and the tab strip under it) jumped. The
   space costs nothing; the jump costs the reader their place. Kept out of the tab order and the
   accessibility tree while inert, so it is only visually reserved. */
function setApplicable(box, on) {
  box.classList.toggle('inert', !on);
  box.setAttribute('aria-hidden', String(!on));
  box.querySelectorAll('button').forEach(b => { b.tabIndex = on ? 0 : -1; });
}

/* Inside the popup a group is a block, so it marks itself with an attribute the panel's own rules
   read. Same idea as setApplicable: keep the space, drop out of the tab order. */
function setGroupApplicable(box, on) {
  if (!box) return;
  if (on) box.removeAttribute('data-inert'); else box.setAttribute('data-inert', '1');
  box.setAttribute('aria-hidden', String(!on));
  box.querySelectorAll('button').forEach(b => { b.tabIndex = on ? 0 : -1; });
}

function applyRomajiVisibility() {
  const box = el('rjbox');
  if (box) {
    // Not applicable in 日本語 mode. It would offer a choice about text that is not on the page.
    setGroupApplicable(box, LANG !== 'ja');
    box.querySelectorAll('[data-romaji-set]').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.romajiSet === ROMAJI_STYLE)));
  }
  const fb = el('furibox');
  if (fb) {
    setGroupApplicable(fb, LANG !== 'en');   // nothing to annotate when the Japanese is replaced
    el('furibtn').setAttribute('aria-pressed', String(!!FURIGANA));
  }
  setGroupApplicable(el('enorderbox'), LANG !== 'ja');
  const db = el('dialbox');
  if (db) {
    setGroupApplicable(db, LANG !== 'ja');
    db.querySelectorAll('[data-dialect-set]').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.dialectSet === DIALECT)));
  }
  renderEnOrder();
  renderDialNote();
  markMoreActive();
  renderFuriNote();
}

/* The "…" button lights when anything behind it is set, because a control that hides its own state
   is a control the reader has to open to check. Same accent as the filter row uses for the same
   meaning: this is set, not this is wrong. */
function markMoreActive() {
  const b = el('morebtn');
  if (!b) return;
  const changed = ROMAJI_STYLE !== 'macron' || FURIGANA || DIALECT !== 'gb'
    || EN_ORDER.join() !== EN_DEFAULT.join();
  if (changed) b.setAttribute('data-active', '1'); else b.removeAttribute('data-active');
}

/* HOW MANY WORKS EACH LEVEL WOULD ACTUALLY BE USED FOR, in the order currently set. Not how many
   hold that form, which is a different and much less useful number: with the default order,
   Licensed is held by six works and used for the four of them that have no official English name.

   Counting the effect rather than the availability is also what makes "this will not apply"
   exact. An earlier version guessed at it by looking for a level held by every work, which never
   fired, because romaji is held for 1,045 of 1,074 and not for all of them. A level used zero
   times is used zero times, and there is nothing to infer.

   Counted from the data on screen rather than baked at build time, so the numbers cannot drift
   away from the file they describe. */
function enLevelCounts(order) {
  order = order || EN_ORDER;
  const out = { licensed: 0, 'official-jp': 0, translated: 0, romaji: 0, total: 0, none: 0 };
  if (!NAMES || !NAMES.titles) return out;
  for (const k in NAMES.titles) {
    out.total++;
    const have = enAvailable(NAMES.titles[k]);
    const used = order.find(lv => have[lv]);
    if (used) out[used]++; else out.none++;
  }
  return out;
}

function renderEnOrder() {
  const ol = el('enorder');
  if (!ol) return;
  const counts = enLevelCounts();
  ol.innerHTML = '';
  EN_ORDER.forEach((lv, i) => {
    const li = document.createElement('li');
    li.className = 'enorow';
    li.draggable = true;
    li.dataset.level = lv;
    // Zero works reach this level in the order as it stands, so moving it about below its current
    // position changes nothing on the page. Struck through rather than hidden: the reader put it
    // there, and it has to stay visible to be dragged back out.
    if (!counts[lv]) li.dataset.dead = '1';
    const [ja, en] = EN_LEVEL_LABEL[lv];
    li.innerHTML =
      `<span class="grip" aria-hidden="true">⠿</span>` +
      `<span class="nm">${esc(T(ja, en))}</span>` +
      `<span class="ct">${counts[lv]}</span>` +
      `<button class="mv" data-mv="up" ${i === 0 ? 'disabled' : ''} ` +
        `aria-label="${esc(T('上へ', 'move up'))}">▲</button>` +
      `<button class="mv" data-mv="down" ${i === EN_ORDER.length - 1 ? 'disabled' : ''} ` +
        `aria-label="${esc(T('下へ', 'move down'))}">▼</button>`;
    ol.appendChild(li);
  });
  const note = el('enordernote');
  if (note) {
    const dead = EN_LEVELS.filter(lv => !counts[lv]);
    const base = T('数字はこの順序で実際に使われる作品数です。',
                   'The number is how many works actually use that form, in this order.');
    note.textContent = dead.length
      ? base + T(' 取り消し線の項目は現在どの作品にも使われません。',
                 ' Struck-through entries are used by no work as things stand.')
      : base;
  }
}

function renderDialNote() {
  const n = el('dialnote');
  if (!n) return;
  n.textContent = T(
    'ライセンス版・公式英題には適用されません。題名そのものだからです。',
    'Not applied to licensed or official titles: the spelling is part of the name.');
}

function setEnOrder(next) {
  EN_ORDER = next;
  prefSet(PREF_ENORDER, EN_ORDER);
  renderEnOrder();
  markMoreActive();
  if (FEED) { renderFeed(); renderCat(); renderSeries(); }
}

function moveLevel(from, to) {
  if (to < 0 || to >= EN_ORDER.length || from === to) return;
  const next = EN_ORDER.slice();
  next.splice(to, 0, next.splice(from, 1)[0]);
  setEnOrder(next);
}
document.addEventListener('DOMContentLoaded', () => {
  const fb = el('furibtn');
  if (fb) fb.addEventListener('click', () => {
    FURIGANA = !FURIGANA;
    prefSet(PREF_FURI, FURIGANA);
    applyRomajiVisibility();
    if (FEED) { renderFeed(); renderCat(); renderSeries(); }
  });
  document.querySelectorAll('[data-romaji-set]').forEach(b =>
    b.addEventListener('click', () => {
      ROMAJI_STYLE = b.dataset.romajiSet;
      prefSet(PREF_ROMAJI, ROMAJI_STYLE);
      applyRomajiVisibility();
      if (FEED) { renderFeed(); renderCat(); renderSeries(); }
    }));
  document.querySelectorAll('[data-dialect-set]').forEach(b =>
    b.addEventListener('click', () => {
      DIALECT = b.dataset.dialectSet;
      prefSet(PREF_DIALECT, DIALECT);
      // The markup-level strings are rewritten by the language pass and by nothing else, so the
      // panel's own label kept saying romanisation after the reader asked for en-US.
