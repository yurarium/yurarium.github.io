<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Yurarium 仮</title>
<link rel="stylesheet" href="app.css?v=1f686d8f">
</head>
<body>
<div class="wrap">
<header>
  <div class="masthead">
   <div class="mast-text">
    <h1><span class="brand">Yurarium</span> <span class="tag" data-i18n>仮 / provisional</span></h1>
    <!-- The page opened on a title and a tab strip with nothing saying what it was. Rendered in
        JS because it follows the language toggle like everything else. -->
    <p id="byline"></p>
   </div>
    <span class="ctlbar">
      <!-- Row 1: the controls that are ALWAYS applicable, so they never move.
           Row 2: the two that depend on the language. Splitting every group onto its own line
           cost three rows for six buttons; pairing the stable ones keeps it to two, which is the
           fewest that still lets the conditional pair appear and vanish without shifting them. -->
      <span class="ctlrow">
      <span class="themebox" role="group" aria-label="配色 / colour theme" id="thbox">
        <!-- Theme is not a language, so unlike the buttons above these follow the locale like
             the rest of the chrome. data-i18n puts them through the same splitter. -->
        <button class="themebtn" data-theme-set="auto"  data-i18n title="follow system">自動 / auto</button>
        <button class="themebtn" data-theme-set="light" data-i18n title="light">明 / light</button>
        <button class="themebtn" data-theme-set="dark"  data-i18n title="dark">暗 / dark</button>
      </span>
      <span class="themebox" role="group" aria-label="表示言語 / interface language">
        <button class="themebtn" data-lang-set="ja"   title="日本語のみ">日本語</button>
        <button class="themebtn" data-lang-set="en"   title="English only">EN</button>
        <!-- Each language button labels itself IN its own language, so they do not follow the
             toggle: 日本語 and EN are legible to the reader who wants them. 両 alone is not: it
             says nothing to someone who does not read Japanese, which is exactly half the audience
             this button serves. So it carries its gloss permanently rather than conditionally. -->
        <button class="themebtn" data-lang-set="both" title="both / 併記">両 both</button>
      </span>
      <span class="themebox langmore" role="group" aria-label="表示の詳細 / display detail">
        <button class="themebtn" id="morebtn" aria-haspopup="dialog" aria-expanded="false"
                title="表示の詳細 / display detail">…</button>
        <div class="morepop" id="morepop" role="dialog" aria-label="表示の詳細 / display detail" hidden>

          <!-- Furigana. Optional (§5c), off by default. The button demonstrates itself: 振仮名
               wearing its own furigana. A bare ふ said nothing to a reader who did not already know
               the feature, which is precisely the reader it is for. -->
          <div class="moregrp conditional" id="furibox">
            <span class="morelab" data-i18n>ふりがな / furigana</span>
            <span class="themebox">
              <button class="themebtn furibtn" id="furibtn"
                      title="ふりがな / show readings above kanji"><ruby>振仮名<rt>ふりがな</rt></ruby></button>
            </span>
            <p class="morenote" id="furinote"></p>
          </div>

          <hr class="moresep">
          <!-- Romanisation style. Taste, not correctness, so it is the reader's (NAMES-PLAN §8.1).
               All three are rendered at build time from the same kana, so switching costs nothing. -->
          <div class="moregrp conditional" id="rjbox">
            <span class="morelab" data-i18n>ローマ字 / romanisation</span>
            <span class="themebox">
              <button class="themebtn" data-romaji-set="macron" title="macron: Tōkyō, Yūri">ō</button>
              <button class="themebtn" data-romaji-set="double" title="doubled vowel: Toukyou, Yuuri">ou</button>
              <button class="themebtn" data-romaji-set="plain"  title="plain: Tokyo, Yuri">o</button>
            </span>
          </div>

          <!-- NAME ORDER. A Japanese name is written family first, and English-language practice
               is split: a library catalogue keeps the Japanese order, a bookshop usually reverses
               it. Both are right and the reader knows which they want, so it is theirs. It shows
               only in English, where a romanisation is what stands in for the name. -->
          <div class="moregrp conditional" id="norderbox">
            <span class="morelab" data-i18n>人名の順序 / name order</span>
            <span class="themebox">
              <button class="themebtn" data-nameorder-set="family" data-i18n title="family name first, as written in Japanese: Iruma Hitoma">姓→名 / family first</button>
              <button class="themebtn" data-nameorder-set="given"  data-i18n title="given name first, as usual in English: Hitoma Iruma">名→姓 / given first</button>
            </span>
          </div>


          <!-- Which English a work is shown by, when it has more than one. The order was fixed
               here and is now the reader's: somebody who knows a series by what a licensor calls
               it should not have to know that we prefer the work's own name. -->
          <div class="moregrp conditional" id="enorderbox">
            <span class="morelab" data-i18n>英語表記の優先順位 / English name, in order of preference</span>
            <ol class="enorder" id="enorder"></ol>
            <p class="morenote" id="enordernote"></p>
          </div>

          <!-- Applied ONLY to text we wrote. A licensed or official English title is a name, and a
               name is not respelt: The Moon on a Rainy Night is what Kodansha publishes it as
               whichever side of the Atlantic the reader is on. -->
          <div class="moregrp conditional" id="dialbox">
            <span class="morelab" data-i18n>綴り / spelling</span>
            <span class="themebox">
              <button class="themebtn" data-dialect-set="gb" title="colour, realise">en-GB</button>
              <button class="themebtn" data-dialect-set="us" title="color, realize">en-US</button>
            </span>
            <p class="morenote" id="dialnote"></p>
          </div>

          <!-- Dates. Unlike furigana and romanisation this applies in every language, so it is not
               conditional. ISO is the default because it sorts, it is unambiguous, and it is what
               a reader selecting text off the page should get. -->
          <div class="moregrp" id="datebox">
            <span class="morelab" data-i18n>日付 / dates</span>
            <span class="themebox">
              <button class="themebtn" data-datefmt-set="iso" title="2026-08-05">ISO</button>
              <button class="themebtn" data-datefmt-set="local" data-i18n
                      title="8月5日（水） / Wed 05 Aug">現地 / local</button>
            </span>
            <p class="morenote" id="datenote"></p>
          </div>
        </div>
      </span>
      </span>
      </span>
  </div>
</header>

<nav role="tablist">
  <button role="tab" aria-selected="true"  data-tab="feed">更新 <span class="n" id="n-feed"></span></button>
  <button role="tab" aria-selected="false" data-tab="rel">発売 <span class="n" id="n-rel"></span></button>
  <button role="tab" aria-selected="false" data-tab="ser">作品 <span class="n" id="n-ser"></span></button>
  <!-- The volumes tab is gone: print works live in 作品 now. Its counter stays in the DOM
       because the load handler writes to it, and a tab bar is not the place to discover that. -->
  <span id="n-cat" hidden></span>
</nav>

<!-- ── FEED ───────────────────────────────────────────────────────── -->
<section id="tab-feed">
  
  <div class="controls" style="margin-top:.9rem">
    <!-- WHICH PERIOD comes first, because it selects the body of data every other control then
         narrows. It used to sit alone at the foot of the tab, below the list it governs, which
         read as an afterthought and put the most navigational control furthest from the rest.
         The grid is a calendar because a reader picking a period thinks in one, and because an
         option list grows by twelve entries every year. -->
    <div class="monthpick">
      <button id="fmonthbtn" class="themebtn" aria-haspopup="dialog" aria-expanded="false"></button>
      <div id="fmonthpop" class="mpop" role="dialog" aria-label="period" hidden>
          <button class="mrecent" id="mrecent"></button>
        <button class="mrecent" id="msoon"></button>
        <div class="mnav">
          <button id="mprev" aria-label="previous year">‹</button>
          <span id="myear"></span>
          <button id="mnext" aria-label="next year">›</button>
        </div>
        <div class="mgrid" id="mgrid"></div>
      </div>
    </div>
    <input type="search" id="fq" placeholder="検索: 作品名・作者 / work, creator" autocomplete="off">
    <select id="fmodel" title="which updates count">
      <option value="all">すべての更新 / all updates</option>
      <option value="free">無料で読める更新 / free to read</option>
    </select>
    <select id="ftype">
      <option value="">すべての種類 / all kinds</option>
      <option value="chapter">話 / chapters</option>
      <option value="oneshot">読み切り / one-shots</option>
    </select>
    <select id="fplat"><option value="">全プラットフォーム / all platforms</option></select>
    <!-- 表示 is the odd one out: the three above narrow WHICH updates are listed, this one only
         changes how they look. It sat third, splitting the filters around it. Now the filters run
         together and the presentation control sits at the end, against the reset button. -->
    <select id="fview" title="layout" style="margin-left:auto">
      <option value="compact">簡易 / compact</option>
      <option value="detail">詳細 / detailed</option>
    </select>
    <button id="freset" class="themebtn" data-i18n title="clear search and all filters">リセット / reset</button>
  </div>
  <p class="count" id="fcount"></p>
  <p class="snapnote" id="fsnap" hidden></p>
  <div id="feed"></div>
  <p class="empty" id="fempty" hidden>該当なし / no matches</p>
  <!-- The select is the STATE. The picker above only sets it and fires `change`, so everything
       that reads el('fmonth').value, persists VIEW_FIELDS or resets filters is unchanged by the
       move. One producer of the fact, one consumer path. -->
  <select id="fmonth" hidden aria-hidden="true" tabindex="-1"></select>
  <div class="archbar" id="archbar" hidden></div>
</section>

<!-- ── CATALOGUE ──────────────────────────────────────────────────── -->
<section id="tab-ser" hidden>
  <div class="controls">
    <input type="search" id="sq" placeholder="検索: 作品名・作者 / work, creator" autocomplete="off">
    <select id="sstate">
      <option value="">すべて / all</option>
      <option value="active">更新中: 45日以内 / updating</option>
      <option value="oneshot">読切 / one-shots</option>
      <option value="completed">完結 / completed</option>
      <option value="slow">停滞: 1年以内 / slow</option>
      <option value="dormant">休眠: 1年超 / dormant</option>
    </select>
    <select id="sfree">
      <option value="">課金状況を問わない / any access</option>
      <option value="free">無料で読める話がある / has free chapters</option>
    </select>
    <select id="splat"><option value="">全プラットフォーム / all platforms</option></select>
    <select id="ssort">
      <option value="latest">最終更新順 / last updated</option>
      <option value="chapters">話数順 / chapter count</option>
      <option value="work">作品名順 / title</option>
    </select>
    <button id="sreset" class="themebtn" data-i18n title="clear search and all filters">リセット / reset</button>
  </div>
  <p class="count" id="scount"></p>
  <div id="serlist"></div>
  <p class="empty" id="sempty" hidden>該当なし / no matches</p>
</section>

<section id="tab-rel" hidden>
  <!-- Print releases, newest first. Volume dates are month-precision because that is what the
       cataloguing carries; openBD supplies almost no covers for this corpus, so this is a list
       and not a cover grid. See docs/MADB.md. -->
  <div id="rel-list"></div>
</section>

<section id="tab-cat" hidden aria-hidden="true">
  
  <div class="controls" style="margin-top:.9rem">
    <input type="search" id="q" placeholder="検索: 題名・よみ・作者 / title, reading, creator" autocomplete="off">
    <select id="sort">
      <option value="date">刊行順 / by date</option>
      <option value="date-desc">新しい順 / newest</option>
      <option value="yomi">五十音順 / by reading</option>
      <option value="vols">巻数順 / by volumes</option>
    </select>
    <button id="creset" class="themebtn" style="order:99" title="clear search and all filters" data-i18n>リセット / reset</button>
    <select id="filter">
      <option value="">すべて / all works</option>
      <option value="multi">複数巻 / multi-volume</option>
      <option value="single">単巻 / single volume</option>
      <!-- Was: 要確認 / unverified grouping: volumes gathered into a work by title match rather
           than by an explicit series link (80 of 302). That is a statement about how WE grouped
           them, and no reader can adjudicate it. The count now lives on status.html. -->
    </select>
  </div>
  <p class="count" id="count"></p>
  <ol id="list"></ol>
  <p class="empty" id="empty" hidden>該当なし / no matches</p>
</section>

<footer>
  <!-- Rendered in JS rather than written in the markup, because every line of it carries a link
       and the data-i18n split works on plain text. The database's own name was the visible cost of
       that: 文化庁メディア芸術データベース stayed Japanese in English mode because it sat inside an
       anchor nothing translated. Order is sources, then the dating caveat, then where to read more,
       and the storage note last: it is the least urgent thing here and the only one about the
       reader rather than about the manga. -->
  <p id="ftsource"></p>
  <p id="trackfrom" hidden></p>
  <p id="ftstatus"></p>
  <p id="ftprefs"></p>
</footer>
</div>

<script src="app.js?v=93162c90"></script>
</body>
</html>
